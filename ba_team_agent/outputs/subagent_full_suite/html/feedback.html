<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveFootball - Feedback & Support</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f6fa; }
    .feedback-container { max-width: 400px; margin: 5vh auto; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); padding: 2rem; }
  </style>
</head>
<body>
  <div class="feedback-container">
    <h4 class="mb-3">Feedback & Support</h4>
    <form>
      <div class="mb-3">
        <label for="category" class="form-label">Category</label>
        <select class="form-select" id="category">
          <option>Bug Report</option>
          <option>Feature Request</option>
          <option>General Feedback</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="feedbackText" class="form-label">Your Feedback</label>
        <textarea class="form-control" id="feedbackText" rows="4" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary w-100">Submit</button>
      <div class="mt-3 alert alert-success" style="display:none;" role="alert">Thank you for your feedback!</div>
    </form>
  </div>
</body>
</html>
