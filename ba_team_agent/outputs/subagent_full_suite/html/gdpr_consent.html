<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveFootball - GDPR Consent</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f6fa; }
    .gdpr-container { max-width: 400px; margin: 10vh auto; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); padding: 2rem; }
    .gdpr-text { font-size: 1em; }
  </style>
</head>
<body>
  <div class="gdpr-container">
    <h4 class="mb-3">Privacy & GDPR Consent</h4>
    <div class="gdpr-text mb-3">
      To use LiveFootball, you must consent to our processing of your personal data in accordance with the <a href="#">Privacy Policy</a> (GDPR).
    </div>
    <form>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="consentCheck" required>
        <label class="form-check-label" for="consentCheck">
          I consent to the processing of my data as described above.
        </label>
      </div>
      <button type="submit" class="btn btn-success w-100">Continue</button>
    </form>
  </div>
</body>
</html>
