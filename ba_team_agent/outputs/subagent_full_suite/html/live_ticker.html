<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveFootball - Live Ticker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f6fa; }
    .live-container { max-width: 600px; margin: 3vh auto 8vh auto; }
    .match-card { border-left: 6px solid #1976d2; margin-bottom: 1rem; background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
    .favorite { border-left-color: #43a047 !important; }
    .event-list { font-size: 0.97em; }
    .offline-banner { background: #ffe082; color: #6d4c00; padding: 0.5rem 1rem; border-radius: 6px; margin-bottom: 1rem; display: none; }
    .stream-link { margin-top: 0.5rem; }
    .nav-bottom { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; border-top: 1px solid #eee; }
    .nav-link.active { color: #1976d2 !important; }
  </style>
</head>
<body>
  <div class="live-container">
    <div class="offline-banner" id="offlineBanner">You are offline. Showing cached data.</div>
    <h4 class="mb-3">Live Scores</h4>
    <div class="match-card favorite p-3">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <strong>FC Barcelona</strong> vs <strong>Real Madrid</strong>
        </div>
        <span class="badge bg-success">LIVE</span>
      </div>
      <div class="event-list mt-2">
        <div>12' ⚽ Benzema (0-1)</div>
        <div>34' 🟨 Busquets (Foul)</div>
        <div>45+2' ⏸️ Half Time</div>
      </div>
      <a href="#" class="btn btn-danger btn-sm stream-link">Watch Live Stream</a>
    </div>
    <div class="match-card p-3">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <strong>Man Utd</strong> vs <strong>Chelsea</strong>
        </div>
        <span class="badge bg-secondary">FT</span>
      </div>
      <div class="event-list mt-2">
        <div>90' ⚽ Rashford (2-1)</div>
        <div>90+4' 🔔 Full Time</div>
      </div>
      <!-- Stream link hidden if rights not fulfilled -->
    </div>
  </div>
  <nav class="nav nav-pills nav-fill nav-bottom">
    <a class="nav-link" href="#">Home</a>
    <a class="nav-link active" href="#">Live</a>
    <a class="nav-link" href="#">News</a>
    <a class="nav-link" href="#">Teams</a>
    <a class="nav-link" href="#">Settings</a>
  </nav>
</body>
</html>
