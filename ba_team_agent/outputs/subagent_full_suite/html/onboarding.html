<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveFootball - Onboarding</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f6fa; }
    .onboarding-container { max-width: 420px; margin: 5vh auto; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); padding: 2rem; }
    .badge-team { margin: 0.2rem; font-size: 1rem; }
    .progress { height: 8px; }
  </style>
</head>
<body>
  <div class="onboarding-container">
    <h4 class="mb-3">Personalize Your Experience</h4>
    <div class="mb-2">Select your favorite teams:</div>
    <div class="mb-3">
      <span class="badge bg-primary badge-team">FC Barcelona</span>
      <span class="badge bg-secondary badge-team">Manchester United</span>
      <span class="badge bg-success badge-team">Bayern Munich</span>
      <span class="badge bg-warning text-dark badge-team">Juventus</span>
      <span class="badge bg-info text-dark badge-team">Paris SG</span>
      <!-- ...more teams... -->
    </div>
    <div class="mb-2">Select your favorite leagues:</div>
    <div class="mb-3">
      <span class="badge bg-dark badge-team">Premier League</span>
      <span class="badge bg-danger badge-team">La Liga</span>
      <span class="badge bg-primary badge-team">Bundesliga</span>
      <span class="badge bg-success badge-team">Serie A</span>
      <span class="badge bg-warning text-dark badge-team">Ligue 1</span>
      <!-- ...more leagues... -->
    </div>
    <div class="progress mb-3">
      <div class="progress-bar" role="progressbar" style="width: 60%;" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100"></div>
    </div>
    <button class="btn btn-success w-100">Save & Continue</button>
  </div>
</body>
</html>
