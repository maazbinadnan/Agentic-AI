<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveFootball - Settings & Account</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f6fa; }
    .settings-container { max-width: 400px; margin: 5vh auto; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); padding: 2rem; }
    .section-title { font-size: 1.1em; margin-top: 1.5rem; }
  </style>
</head>
<body>
  <div class="settings-container">
    <h4 class="mb-3">Settings & Account</h4>
    <div>
      <div class="section-title">Personalization</div>
      <a href="#" class="btn btn-outline-primary w-100 mb-2">Edit Favorite Teams & Leagues</a>
      <a href="#" class="btn btn-outline-success w-100 mb-2">Notification Preferences</a>
    </div>
    <div>
      <div class="section-title">Account Management</div>
      <a href="#" class="btn btn-outline-secondary w-100 mb-2">Export My Data</a>
      <a href="#" class="btn btn-outline-danger w-100 mb-2">Delete My Account</a>
    </div>
    <div>
      <div class="section-title">Privacy & Legal</div>
      <a href="#" class="btn btn-link w-100">Privacy Policy (GDPR)</a>
    </div>
    <div class="mt-4">
      <a href="#" class="btn btn-outline-dark w-100">Logout</a>
    </div>
  </div>
</body>
</html>
