<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveFootball - Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f6fa; }
    .dashboard-container { max-width: 600px; margin: 3vh auto 8vh auto; }
    .card-metric { min-width: 140px; margin-right: 1rem; }
    .offline-banner { background: #ffe082; color: #6d4c00; padding: 0.5rem 1rem; border-radius: 6px; margin-bottom: 1rem; display: none; }
    .nav-bottom { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; border-top: 1px solid #eee; }
    .nav-link.active { color: #1976d2 !important; }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <div class="offline-banner" id="offlineBanner">You are offline. Showing cached data.</div>
    <h4 class="mb-3">Welcome back!</h4>
    <div class="d-flex mb-3">
      <div class="card card-metric">
        <div class="card-body text-center">
          <div class="fw-bold">Next Match</div>
          <div>FC Barcelona vs Real Madrid</div>
          <div class="text-muted" style="font-size:0.9em;">Sat, 18:00</div>
        </div>
      </div>
      <div class="card card-metric">
        <div class="card-body text-center">
          <div class="fw-bold">Last Result</div>
          <div>Man Utd 2-1 Chelsea</div>
          <div class="text-muted" style="font-size:0.9em;">Yesterday</div>
        </div>
      </div>
    </div>
    <div class="card mb-3">
      <div class="card-body">
        <h6>Quick Links</h6>
        <div class="d-flex flex-wrap gap-2">
          <a href="#" class="btn btn-outline-primary btn-sm">Live Scores</a>
          <a href="#" class="btn btn-outline-success btn-sm">News</a>
          <a href="#" class="btn btn-outline-secondary btn-sm">Teams</a>
          <a href="#" class="btn btn-outline-warning btn-sm">Settings</a>
        </div>
      </div>
    </div>
  </div>
  <nav class="nav nav-pills nav-fill nav-bottom">
    <a class="nav-link active" href="#">Home</a>
    <a class="nav-link" href="#">Live</a>
    <a class="nav-link" href="#">News</a>
    <a class="nav-link" href="#">Teams</a>
    <a class="nav-link" href="#">Settings</a>
  </nav>
</body>
</html>
