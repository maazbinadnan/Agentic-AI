<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveFootball - Notification Preferences</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f6fa; }
    .notif-container { max-width: 400px; margin: 5vh auto; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); padding: 2rem; }
    .toggle-label { font-size: 1.1em; }
  </style>
</head>
<body>
  <div class="notif-container">
    <h4 class="mb-3">Notification Preferences</h4>
    <form>
      <div class="form-check form-switch mb-3">
        <input class="form-check-input" type="checkbox" id="notifGoals" checked>
        <label class="form-check-label toggle-label" for="notifGoals">Goals & Match Events</label>
      </div>
      <div class="form-check form-switch mb-3">
        <input class="form-check-input" type="checkbox" id="notifNews" checked>
        <label class="form-check-label toggle-label" for="notifNews">News Updates</label>
      </div>
      <div class="form-check form-switch mb-3">
        <input class="form-check-input" type="checkbox" id="notifResults">
        <label class="form-check-label toggle-label" for="notifResults">Final Results</label>
      </div>
      <button type="submit" class="btn btn-success w-100">Save Preferences</button>
    </form>
  </div>
</body>
</html>
