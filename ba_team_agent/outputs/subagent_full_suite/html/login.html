<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveFootball - Login & Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f6fa; }
    .login-container { max-width: 400px; margin: 5vh auto; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); padding: 2rem; }
    .logo { width: 60px; margin-bottom: 1rem; }
    .gdpr { font-size: 0.9rem; }
    .error-msg { color: #d32f2f; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="text-center">
      <img src="https://img.icons8.com/color/96/football2.png" alt="LiveFootball Logo" class="logo"/>
      <h3 class="mb-3">LiveFootball</h3>
    </div>
    <form>
      <div class="mb-3">
        <label for="email" class="form-label">Email address</label>
        <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" placeholder="Password" required>
      </div>
      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="gdprConsent" required>
        <label class="form-check-label gdpr" for="gdprConsent">
          I agree to the <a href="#" tabindex="0">Privacy Policy (GDPR)</a>
        </label>
      </div>
      <div class="error-msg" role="alert" style="display:none;">Invalid credentials. Please try again.</div>
      <button type="submit" class="btn btn-primary w-100">Login / Register</button>
      <div class="mt-3 text-end">
        <a href="#" class="link-secondary" tabindex="0">Forgot Password?</a>
      </div>
    </form>
  </div>
</body>
</html>
