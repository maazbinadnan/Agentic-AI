<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login & Registration - Football App</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
      --color-border: #dee2e6;
      --color-error: #dc3545;
      --color-card: #fff;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      background: var(--color-card);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      padding: 32px 24px;
      width: 360px;
      border: 1px solid var(--color-border);
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 16px;
      text-align: center;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-weight: 500;
    }
    input[type="email"], input[type="password"] {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      font-size: 1rem;
      background: var(--color-bg);
    }
    .btn-primary {
      background: var(--color-primary);
      color: #fff;
      border: none;
      padding: 10px 0;
      width: 100%;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .social-login {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }
    .social-btn {
      background: var(--color-bg);
      color: var(--color-text);
      border: 1px solid var(--color-border);
      border-radius: 4px;
      padding: 10px 0;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .error-message {
      color: var(--color-error);
      font-size: 0.95rem;
      margin-bottom: 12px;
      text-align: center;
    }
    .divider {
      text-align: center;
      margin: 16px 0;
      color: var(--color-border);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <section class="container" aria-label="Login and Registration">
      <h1>Welcome to Football App</h1>
      <!-- Error State Example -->
      <div class="error-message" style="display: none;" id="errorMsg">Invalid email or password. Please try again.</div>
      <form>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn-primary">Log In / Register</button>
      </form>
      <div class="divider">or</div>
      <div class="social-login">
        <button class="social-btn" aria-label="Login with Google">🔵 Login with Google</button>
        <button class="social-btn" aria-label="Login with Apple">⚫ Login with Apple</button>
        <button class="social-btn" aria-label="Login with Facebook">🔷 Login with Facebook</button>
      </div>
    </section>
  </main>
</body>
</html>
