<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Module Configuration - Football App</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
      --color-border: #dee2e6;
      --color-card: #fff;
      --color-error: #dc3545;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      margin: 0;
      min-height: 100vh;
    }
    .container {
      max-width: 420px;
      margin: 40px auto;
      background: var(--color-card);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      padding: 32px 24px;
      border: 1px solid var(--color-border);
    }
    h2 {
      font-size: 1.3rem;
      margin-bottom: 20px;
      text-align: center;
    }
    .modules-list {
      margin-bottom: 24px;
    }
    .module-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 8px;
    }
    .add-btn {
      background: var(--color-primary);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
    }
    .error-message {
      color: var(--color-error);
      font-size: 1rem;
      background: var(--color-bg);
      border: 1px solid var(--color-error);
      border-radius: 4px;
      padding: 12px;
      text-align: center;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <main>
    <section class="container" aria-label="Module Configuration">
      <h2>Configure Modules</h2>
      <div class="modules-list">
        <div class="module-row">
          <span>Official Module: Fantasy League</span>
          <button class="add-btn">Add</button>
        </div>
        <div class="module-row">
          <span>Official Module: Match Predictor</span>
          <button class="add-btn">Add</button>
        </div>
      </div>
      <!-- Third-party attempt error -->
      <div class="error-message" style="display: none;">Only official modules are supported. Third-party modules cannot be added.</div>
    </section>
  </main>
</body>
</html>
