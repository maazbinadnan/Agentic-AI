<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notification Settings - Football App</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
      --color-border: #dee2e6;
      --color-card: #fff;
      --color-success: #28a745;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      margin: 0;
      min-height: 100vh;
    }
    .container {
      max-width: 420px;
      margin: 40px auto;
      background: var(--color-card);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      padding: 32px 24px;
      border: 1px solid var(--color-border);
    }
    h2 {
      font-size: 1.3rem;
      margin-bottom: 20px;
      text-align: center;
    }
    .notification-types {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: 6px;
      padding: 12px 16px;
    }
    .toggle-label {
      font-size: 1rem;
      font-weight: 500;
    }
    .toggle-switch {
      width: 40px;
      height: 22px;
      background: var(--color-border);
      border-radius: 12px;
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle-switch.active {
      background: var(--color-primary);
    }
    .toggle-knob {
      width: 18px;
      height: 18px;
      background: #fff;
      border-radius: 50%;
      position: absolute;
      top: 2px;
      left: 2px;
      transition: left 0.2s;
    }
    .toggle-switch.active .toggle-knob {
      left: 20px;
    }
    .save-btn {
      background: var(--color-primary);
      color: #fff;
      border: none;
      padding: 10px 0;
      width: 100%;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 16px;
    }
    .preview {
      background: var(--color-success);
      color: #fff;
      border-radius: 6px;
      padding: 12px;
      text-align: center;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <main>
    <section class="container" aria-label="Notification Settings">
      <h2>Notification Preferences</h2>
      <div class="notification-types">
        <div class="toggle-row">
          <span class="toggle-label">Goals</span>
          <div class="toggle-switch active" tabindex="0" aria-checked="true">
            <div class="toggle-knob"></div>
          </div>
        </div>
        <div class="toggle-row">
          <span class="toggle-label">News</span>
          <div class="toggle-switch" tabindex="0" aria-checked="false">
            <div class="toggle-knob"></div>
          </div>
        </div>
        <div class="toggle-row">
          <span class="toggle-label">Match Start/End</span>
          <div class="toggle-switch active" tabindex="0" aria-checked="true">
            <div class="toggle-knob"></div>
          </div>
        </div>
      </div>
      <button class="save-btn">Save Notification Settings</button>
      <div class="preview">Sample Notification: FC Awesome scored a goal!</div>
    </section>
  </main>
</body>
</html>
