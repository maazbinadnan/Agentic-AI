<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Share News/Match Report - Football App</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
      --color-border: #dee2e6;
      --color-card: #fff;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      margin: 0;
      min-height: 100vh;
    }
    .container {
      max-width: 420px;
      margin: 40px auto;
      background: var(--color-card);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      padding: 32px 24px;
      border: 1px solid var(--color-border);
    }
    h2 {
      font-size: 1.3rem;
      margin-bottom: 20px;
      text-align: center;
    }
    .news-card {
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .share-btn {
      background: var(--color-primary);
      color: #fff;
      border: none;
      padding: 10px 0;
      width: 100%;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .share-options {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 16px;
    }
    .option-btn {
      background: var(--color-bg);
      color: var(--color-text);
      border: 1px solid var(--color-border);
      border-radius: 4px;
      padding: 8px 16px;
      font-size: 1rem;
      cursor: pointer;
    }
    .native-dialog {
      font-size: 0.95rem;
      color: var(--color-primary);
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <section class="container" aria-label="Share News or Match Report">
      <h2>Share News</h2>
      <div class="news-card">
        <div><strong>FC Awesome Wins Derby!</strong></div>
        <div>FC Awesome clinched a dramatic victory in the city derby, with a last-minute goal by star striker John Legend.</div>
      </div>
      <button class="share-btn">Share</button>
      <div class="share-options">
        <button class="option-btn">Facebook</button>
        <button class="option-btn">Twitter</button>
        <button class="option-btn">WhatsApp</button>
      </div>
      <div class="native-dialog">Native sharing dialog will open for selected platform.</div>
    </section>
  </main>
</body>
</html>
