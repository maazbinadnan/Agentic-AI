<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Stream - Football App</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
      --color-border: #dee2e6;
      --color-error: #dc3545;
      --color-card: #fff;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      margin: 0;
      min-height: 100vh;
    }
    .container {
      max-width: 420px;
      margin: 40px auto;
      background: var(--color-card);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      padding: 32px 24px;
      border: 1px solid var(--color-border);
    }
    h2 {
      font-size: 1.3rem;
      margin-bottom: 20px;
      text-align: center;
    }
    .stream-btn {
      background: var(--color-primary);
      color: #fff;
      border: none;
      padding: 10px 0;
      width: 100%;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 16px;
    }
    .external-indicator {
      font-size: 0.95rem;
      color: var(--color-primary);
      text-align: center;
      margin-bottom: 16px;
    }
    .error-message {
      color: var(--color-error);
      font-size: 1rem;
      background: var(--color-bg);
      border: 1px solid var(--color-error);
      border-radius: 4px;
      padding: 12px;
      text-align: center;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <main>
    <section class="container" aria-label="Live Stream">
      <h2>Watch Live Match</h2>
      <!-- Permitted State -->
      <button class="stream-btn">Watch Live Stream</button>
      <div class="external-indicator">Stream will open in your browser or native player.</div>
      <!-- Restricted State Example -->
      <div class="error-message" style="display: none;">Live stream unavailable in your country due to transmission rights.</div>
    </section>
  </main>
</body>
</html>
