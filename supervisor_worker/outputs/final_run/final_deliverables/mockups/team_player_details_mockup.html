<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Team & Player Details - Football App</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
      --color-border: #dee2e6;
      --color-card: #fff;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      margin: 0;
      min-height: 100vh;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background: var(--color-card);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      padding: 32px 24px;
      border: 1px solid var(--color-border);
    }
    h2 {
      font-size: 1.3rem;
      margin-bottom: 20px;
      text-align: center;
    }
    .details-section {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .team-details, .player-details {
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: 6px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .section-title {
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 8px;
    }
    .stats {
      font-size: 0.95rem;
      color: var(--color-primary);
    }
  </style>
</head>
<body>
  <main>
    <section class="container" aria-label="Team and Player Details">
      <h2>Team & Player Information</h2>
      <div class="details-section">
        <div class="team-details">
          <div class="section-title">Team: FC Awesome</div>
          <div class="stats">Wins: 12 | Draws: 3 | Losses: 2</div>
          <div>Coach: Alex Winner</div>
          <div>Stadium: Awesome Arena</div>
        </div>
        <div class="player-details">
          <div class="section-title">Player: John Legend</div>
          <div class="stats">Goals: 18 | Assists: 7 | Matches: 22</div>
          <div>Position: Striker</div>
          <div>Age: 27</div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
