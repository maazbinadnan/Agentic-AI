<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Preferences - Football App</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
      --color-border: #dee2e6;
      --color-card: #fff;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      background: var(--color-card);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      padding: 32px 24px;
      width: 420px;
      border: 1px solid var(--color-border);
    }
    h2 {
      font-size: 1.3rem;
      margin-bottom: 20px;
      text-align: center;
    }
    .teams {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
      justify-content: center;
    }
    .team-card {
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: 6px;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .team-card.selected {
      background: var(--color-primary);
      color: #fff;
      border-color: var(--color-primary);
    }
    .channels {
      margin-bottom: 24px;
    }
    .channel-checkbox {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      font-size: 1rem;
    }
    .save-btn {
      background: var(--color-primary);
      color: #fff;
      border: none;
      padding: 10px 0;
      width: 100%;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <section class="container" aria-label="Preferences">
      <h2>Select Your Favorites</h2>
      <div class="teams">
        <div class="team-card selected" tabindex="0">⚽ FC Awesome</div>
        <div class="team-card" tabindex="0">⚽ United Stars</div>
        <div class="team-card" tabindex="0">⚽ City Legends</div>
        <div class="team-card" tabindex="0">⚽ Real Champions</div>
      </div>
      <div class="channels">
        <div class="channel-checkbox">
          <input type="checkbox" id="channel1" checked>
          <label for="channel1">Sports Channel 1</label>
        </div>
        <div class="channel-checkbox">
          <input type="checkbox" id="channel2">
          <label for="channel2">Sports Channel 2</label>
        </div>
        <div class="channel-checkbox">
          <input type="checkbox" id="channel3">
          <label for="channel3">Sports Channel 3</label>
        </div>
      </div>
      <button class="save-btn">Save Preferences</button>
    </section>
  </main>
</body>
</html>
