<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UI Consistency - Football App</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
      --color-border: #dee2e6;
      --color-card: #fff;
      --color-info: #17a2b8;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      margin: 0;
      min-height: 100vh;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background: var(--color-card);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      padding: 32px 24px;
      border: 1px solid var(--color-border);
    }
    h2 {
      font-size: 1.3rem;
      margin-bottom: 20px;
      text-align: center;
    }
    .ui-modules {
      display: flex;
      gap: 24px;
      margin-bottom: 24px;
      justify-content: center;
    }
    .module {
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: 6px;
      padding: 16px 24px;
      font-size: 1rem;
      text-align: center;
    }
    .info-banner {
      background: var(--color-info);
      color: #fff;
      border-radius: 6px;
      padding: 12px;
      text-align: center;
      font-size: 1rem;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <main>
    <section class="container" aria-label="UI Consistency">
      <h2>App Interface Modules</h2>
      <div class="info-banner">Server update detected. Your interface remains unchanged.</div>
      <div class="ui-modules">
        <div class="module">News Feed</div>
        <div class="module">Live Ticker</div>
        <div class="module">Team Details</div>
        <div class="module">Preferences</div>
      </div>
      <div style="text-align:center; color:var(--color-primary); font-size:1rem;">Interface and modules are consistent.</div>
    </section>
  </main>
</body>
</html>
