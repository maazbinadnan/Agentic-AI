<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Startup Performance</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .splash {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      padding: 48px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .logo {
      font-size: 2rem;
      color: var(--color-primary);
      font-weight: bold;
    }
    .loading {
      font-size: 1.1rem;
      color: #6c757d;
    }
    .timer {
      font-size: 1.2rem;
      color: var(--color-primary);
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="logo">Football Fan App</div>
    <div class="loading">Loading...</div>
    <div class="timer">Ready in 2 seconds</div>
  </div>
</body>
</html>
