<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Registration & Login</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
      --color-border: #dee2e6;
      --color-error: #dc3545;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .container {
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      padding: 32px 24px;
      width: 360px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    h2 {
      margin: 0 0 16px 0;
      font-size: 1.5rem;
      color: var(--color-primary);
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    label {
      font-size: 1rem;
      margin-bottom: 4px;
    }
    input[type="text"], input[type="email"], input[type="password"] {
      padding: 8px;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      font-size: 1rem;
    }
    .gdpr {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
    }
    .error {
      color: var(--color-error);
      font-size: 0.95rem;
      margin-top: 4px;
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    button {
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 8px 16px;
      font-size: 1rem;
      cursor: pointer;
    }
    button.secondary {
      background: #fff;
      color: var(--color-primary);
      border: 1px solid var(--color-primary);
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Welcome to Football Fan App</h2>
    <form id="register">
      <label for="reg-email">Email</label>
      <input type="email" id="reg-email" placeholder="you@email.com" required>
      <label for="reg-password">Password</label>
      <input type="password" id="reg-password" placeholder="Password" required>
      <div class="gdpr">
        <input type="checkbox" id="gdpr-consent" required>
        <label for="gdpr-consent">I consent to GDPR-compliant data processing</label>
      </div>
      <div class="error" style="display:none;">Invalid registration details. Please check your input.</div>
      <div class="actions">
        <button type="submit">Register</button>
        <button type="button" class="secondary">Login</button>
      </div>
    </form>
    <form id="login" style="display:none;">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" placeholder="you@email.com" required>
      <label for="login-password">Password</label>
      <input type="password" id="login-password" placeholder="Password" required>
      <div class="error" style="display:none;">Invalid login credentials.</div>
      <div class="actions">
        <button type="submit">Login</button>
        <button type="button" class="secondary">Register</button>
      </div>
    </form>
  </div>
</body>
</html>
