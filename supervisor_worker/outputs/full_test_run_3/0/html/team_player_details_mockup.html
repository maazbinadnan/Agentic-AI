<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Team & Player Details</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
      --color-border: #dee2e6;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      margin: 0;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      padding: 32px 24px;
    }
    h2 {
      color: var(--color-primary);
      margin-bottom: 16px;
    }
    .details {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .team-section, .player-section {
      border: 1px solid var(--color-border);
      border-radius: 6px;
      background: #f8f9fa;
      padding: 16px;
    }
    .section-title {
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 8px;
    }
    .stats {
      font-size: 0.95rem;
      color: #6c757d;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Team & Player Details</h2>
    <div class="details">
      <div class="team-section">
        <div class="section-title">FC Barcelona</div>
        <div class="stats">Founded: 1899 | Stadium: Camp Nou | Coach: Xavi</div>
        <div>Recent Results: W-W-D-L-W</div>
      </div>
      <div class="player-section">
        <div class="section-title">Lionel Messi</div>
        <div class="stats">Position: Forward | Age: 35 | Nationality: Argentina</div>
        <div>Goals this season: 18 | Assists: 7</div>
      </div>
    </div>
  </div>
</body>
</html>
