<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Share News</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
      --color-border: #dee2e6;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      margin: 0;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      padding: 32px 24px;
    }
    .news-card {
      border: 1px solid var(--color-border);
      border-radius: 6px;
      background: #f8f9fa;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 24px;
    }
    .news-title {
      font-weight: bold;
      font-size: 1.1rem;
    }
    .news-meta {
      font-size: 0.95rem;
      color: #6c757d;
    }
    .share-btn {
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 8px 16px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 8px;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.2);
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .modal-content {
      background: #fff;
      border-radius: 8px;
      padding: 24px;
      min-width: 280px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .platform-btn {
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 8px 16px;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="news-card">
      <div class="news-title">Barcelona signs new striker</div>
      <div class="news-meta">FC Barcelona | 2 hours ago</div>
      <div>Barcelona has announced the signing of a new forward for the upcoming season...</div>
      <button class="share-btn">Share</button>
    </div>
    <div class="modal" id="share-modal" style="display:none;">
      <div class="modal-content">
        <div>Select platform to share:</div>
        <button class="platform-btn">Twitter</button>
        <button class="platform-btn">Facebook</button>
        <button class="platform-btn">WhatsApp</button>
        <button class="platform-btn">Cancel</button>
      </div>
    </div>
  </div>
</body>
</html>
