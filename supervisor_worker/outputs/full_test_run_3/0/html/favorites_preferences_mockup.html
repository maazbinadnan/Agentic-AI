<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Favorites Preferences</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
      --color-border: #dee2e6;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .container {
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      padding: 32px 24px;
      width: 420px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    h2 {
      color: var(--color-primary);
      margin-bottom: 8px;
    }
    .section {
      margin-bottom: 16px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .card {
      border: 1px solid var(--color-border);
      border-radius: 6px;
      background: #f8f9fa;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: border 0.2s;
    }
    .card.selected {
      border: 2px solid var(--color-primary);
      background: #e7f1ff;
    }
    .save-btn {
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Select Your Favorites</h2>
    <div class="section">
      <strong>Teams</strong>
      <div class="grid">
        <div class="card selected">FC Barcelona</div>
        <div class="card">Manchester United</div>
        <div class="card">Real Madrid</div>
        <div class="card">Liverpool</div>
        <div class="card">Juventus</div>
        <div class="card">Bayern Munich</div>
      </div>
    </div>
    <div class="section">
      <strong>Sports Channels</strong>
      <div class="grid">
        <div class="card selected">ESPN</div>
        <div class="card">Sky Sports</div>
        <div class="card">beIN Sports</div>
        <div class="card">DAZN</div>
        <div class="card">Fox Sports</div>
        <div class="card">NBC Sports</div>
      </div>
    </div>
    <button class="save-btn">Save Preferences</button>
  </div>
</body>
</html>
