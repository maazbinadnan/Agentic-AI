<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Offline Mode</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
      --color-border: #dee2e6;
      --color-error: #dc3545;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      margin: 0;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      padding: 32px 24px;
      position: relative;
    }
    .offline-banner {
      position: absolute;
      top: -32px;
      left: 0;
      right: 0;
      background: #f8d7da;
      color: var(--color-error);
      border-radius: 8px 8px 0 0;
      padding: 12px;
      text-align: center;
      font-size: 1rem;
      border-bottom: 1px solid var(--color-error);
    }
    .cached-content {
      margin-top: 24px;
      color: #6c757d;
      font-size: 1rem;
    }
    .network-indicator {
      margin-top: 16px;
      color: var(--color-error);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="offline-banner">You are offline. Showing cached content.</div>
    <div class="cached-content">
      <strong>Cached News:</strong>
      <ul>
        <li>Barcelona signs new striker</li>
        <li>Champions League Draw Results</li>
      </ul>
    </div>
    <div class="network-indicator">Network connection lost.</div>
  </div>
</body>
</html>
