<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Ticker</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
      --color-border: #dee2e6;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      margin: 0;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      padding: 32px 24px;
    }
    h2 {
      color: var(--color-primary);
      margin-bottom: 16px;
    }
    .ticker-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .match-card {
      border: 1px solid var(--color-border);
      border-radius: 6px;
      background: #f8f9fa;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .match-title {
      font-weight: bold;
      font-size: 1.1rem;
    }
    .match-meta {
      font-size: 0.95rem;
      color: #6c757d;
    }
    .empty-state {
      color: #6c757d;
      text-align: center;
      margin-top: 32px;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Live Ticker</h2>
    <div class="ticker-list">
      <div class="match-card">
        <div class="match-title">Barcelona vs Real Madrid</div>
        <div class="match-meta">Live | 65'</div>
        <div>Score: 2 - 1</div>
      </div>
      <div class="match-card">
        <div class="match-title">Manchester United vs Liverpool</div>
        <div class="match-meta">Live | 48'</div>
        <div>Score: 0 - 0</div>
      </div>
    </div>
    <div class="empty-state" style="display:none;">No live matches for your favorite teams.</div>
  </div>
</body>
</html>
