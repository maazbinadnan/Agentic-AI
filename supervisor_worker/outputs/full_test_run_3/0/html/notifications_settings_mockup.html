<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notifications Settings</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
      --color-border: #dee2e6;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .container {
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      padding: 32px 24px;
      width: 360px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    h2 {
      color: var(--color-primary);
      margin-bottom: 8px;
    }
    .toggle {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1rem;
    }
    .preview {
      margin-top: 16px;
      background: #e7f1ff;
      border-radius: 4px;
      padding: 12px;
      color: var(--color-primary);
      font-size: 0.95rem;
    }
    .disabled {
      color: #6c757d;
      background: #f8f9fa;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      padding: 12px;
      font-size: 0.95rem;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Notifications</h2>
    <div class="toggle">
      <input type="checkbox" id="notif-toggle" checked>
      <label for="notif-toggle">Enable real-time notifications</label>
    </div>
    <div class="preview">Sample: "Barcelona scored!" notification will appear.</div>
    <div class="disabled" style="display:none;">Notifications are disabled. You will not receive updates.</div>
  </div>
</body>
</html>
