<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Stream Link</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
      --color-border: #dee2e6;
      --color-error: #dc3545;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      margin: 0;
    }
    .container {
      max-width: 420px;
      margin: 40px auto;
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    h2 {
      color: var(--color-primary);
      margin-bottom: 16px;
    }
    .stream-link {
      background: var(--color-primary);
      color: #fff;
      border-radius: 4px;
      padding: 12px;
      text-align: center;
      font-size: 1.1rem;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .error {
      color: var(--color-error);
      background: #f8d7da;
      border-radius: 4px;
      padding: 12px;
      text-align: center;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Live Stream</h2>
    <div class="stream-link">Watch Live: Barcelona vs Real Madrid</div>
    <div class="error" style="display:none;">Live stream not available in your country.</div>
  </div>
</body>
</html>
