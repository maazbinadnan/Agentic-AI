<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Match Stream</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
      --color-border: #dee2e6;
      --color-error: #dc3545;
      --color-success: #198754;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .container {
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 2rem;
      width: 400px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    h2 {
      color: var(--color-primary);
      margin-top: 0;
    }
    .match-info {
      margin-bottom: 1rem;
    }
    .stream-link {
      display: block;
      background: var(--color-primary);
      color: #fff;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 500;
      margin-bottom: 1rem;
      text-align: center;
    }
    .rights-indicator {
      font-size: 0.95rem;
      color: var(--color-success);
      margin-bottom: 1rem;
    }
    .error {
      color: var(--color-error);
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="container" role="main">
    <h2>Match Stream</h2>
    <div class="match-info">
      <strong>Team A vs Team B</strong><br>
      Date: 2024-06-10<br>
      Status: Live
    </div>
    <!-- Rights fulfilled, stream available -->
    <a class="stream-link" href="#">Watch Live Stream</a>
    <div class="rights-indicator">Stream available in your country.</div>
    <!-- Rights not fulfilled, stream unavailable -->
    <div class="error" style="display:none;">Live stream unavailable in your country.</div>
    <!-- Link update indicator -->
    <div class="rights-indicator" style="display:none;">Stream link updated!</div>
  </div>
</body>
</html>
