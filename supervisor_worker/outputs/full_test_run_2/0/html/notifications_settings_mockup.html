<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notification Settings</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
      --color-border: #dee2e6;
      --color-error: #dc3545;
      --color-success: #198754;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .container {
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 2rem;
      width: 350px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    h2 {
      color: var(--color-primary);
      margin-top: 0;
    }
    .toggle-group {
      margin-bottom: 1rem;
    }
    .toggle-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.5rem;
      font-size: 1rem;
    }
    .toggle-switch {
      width: 40px;
      height: 20px;
      background: #e9ecef;
      border-radius: 10px;
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle-switch[data-enabled="true"] {
      background: var(--color-primary);
    }
    .toggle-knob {
      width: 18px;
      height: 18px;
      background: #fff;
      border-radius: 50%;
      position: absolute;
      top: 1px;
      left: 1px;
      transition: left 0.2s;
    }
    .toggle-switch[data-enabled="true"] .toggle-knob {
      left: 21px;
    }
    .preview {
      background: #e9ecef;
      border-radius: 4px;
      padding: 0.5rem;
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }
    .error {
      color: var(--color-error);
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
    }
    .success {
      color: var(--color-success);
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="container" role="main">
    <h2>Notification Settings</h2>
    <form>
      <div class="toggle-group">
        <div class="toggle-label">
          <span>News Notifications</span>
          <div class="toggle-switch" data-enabled="true">
            <div class="toggle-knob"></div>
          </div>
        </div>
        <div class="toggle-label">
          <span>Results Notifications</span>
          <div class="toggle-switch" data-enabled="false">
            <div class="toggle-knob"></div>
          </div>
        </div>
      </div>
      <div class="preview">Push notification preview: "Team A wins!"</div>
      <button class="btn-primary" type="submit">Save Notification Settings</button>
      <div class="success" style="display:none;">Notification settings updated!</div>
      <div class="error" style="display:none;">Failed to update notification settings.</div>
    </form>
  </div>
</body>
</html>
