<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Team & Player Details</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
      --color-border: #dee2e6;
      --color-error: #dc3545;
      --color-card: #fff;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      margin: 0;
    }
    header {
      background: var(--color-primary);
      color: #fff;
      padding: 1rem;
      text-align: center;
    }
    .details-list {
      max-width: 600px;
      margin: 2rem auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .profile-card {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      position: relative;
    }
    .profile-title {
      font-size: 1.1rem;
      color: var(--color-primary);
      margin-bottom: 0.5rem;
    }
    .profile-meta {
      font-size: 0.9rem;
      color: #6c757d;
      margin-bottom: 0.5rem;
    }
    .profile-content {
      font-size: 1rem;
      color: var(--color-text);
      margin-bottom: 1rem;
    }
    .offline-indicator {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: #ffc107;
      color: #212529;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.85rem;
    }
    .error {
      color: var(--color-error);
      text-align: center;
      margin-top: 2rem;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Team & Player Details</h1>
  </header>
  <div class="details-list">
    <section class="profile-card">
      <div class="profile-title">Team A</div>
      <div class="profile-meta">Founded: 1902 • Stadium: Arena A</div>
      <div class="profile-content">Team A is known for its strong defense and passionate fanbase.</div>
    </section>
    <section class="profile-card">
      <div class="profile-title">Player X</div>
      <div class="profile-meta">Position: Forward • Age: 27</div>
      <div class="profile-content">Player X is a prolific goal scorer and a key player for Team A.</div>
      <div class="offline-indicator">Offline: Showing cached info</div>
    </section>
    <!-- Error/empty state -->
    <div class="error" style="display:none;">No details available for this team/player.</div>
  </div>
</body>
</html>
