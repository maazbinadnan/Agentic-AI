<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Preferences</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
      --color-border: #dee2e6;
      --color-error: #dc3545;
      --color-success: #198754;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .container {
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 2rem;
      width: 400px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    h2 {
      color: var(--color-primary);
      margin-top: 0;
    }
    .section {
      margin-bottom: 1.5rem;
    }
    .list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .list label {
      background: #e9ecef;
      border-radius: 4px;
      padding: 0.5rem 1rem;
      cursor: pointer;
      font-size: 1rem;
      border: 1px solid var(--color-border);
    }
    .list input[type="checkbox"] {
      margin-right: 0.5rem;
    }
    .btn-primary {
      background: var(--color-primary);
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      margin-top: 1rem;
    }
    .status {
      margin-top: 1rem;
      font-size: 0.95rem;
    }
    .status.success {
      color: var(--color-success);
    }
    .status.error {
      color: var(--color-error);
    }
    .nav {
      margin-top: 1rem;
      text-align: center;
    }
    .nav a {
      color: var(--color-primary);
      text-decoration: none;
      margin: 0 0.5rem;
      font-size: 0.95rem;
    }
    .nav a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container" role="main">
    <h2>Preferences</h2>
    <form aria-label="Preferences Form">
      <div class="section">
        <strong>Select Favorite Teams:</strong>
        <div class="list">
          <label><input type="checkbox" name="teams" value="TeamA" aria-checked="false"> Team A</label>
          <label><input type="checkbox" name="teams" value="TeamB" aria-checked="false"> Team B</label>
          <label><input type="checkbox" name="teams" value="TeamC" aria-checked="false"> Team C</label>
          <label><input type="checkbox" name="teams" value="TeamD" aria-checked="false"> Team D</label>
        </div>
      </div>
      <div class="section">
        <strong>Select Sports Channels:</strong>
        <div class="list">
          <label><input type="checkbox" name="channels" value="Channel1" aria-checked="false"> Channel 1</label>
          <label><input type="checkbox" name="channels" value="Channel2" aria-checked="false"> Channel 2</label>
          <label><input type="checkbox" name="channels" value="Channel3" aria-checked="false"> Channel 3</label>
        </div>
      </div>
      <button class="btn-primary" type="submit">Save Preferences</button>
      <div class="status success" style="display:none;">Preferences saved and synced!</div>
      <div class="status error" style="display:none;">Failed to sync preferences. Try again.</div>
    </form>
    <nav class="nav" aria-label="Main Navigation">
      <a href="main_dashboard_mockup.html">Back to Dashboard</a>
      <a href="notifications_settings_mockup.html">Notification Settings</a>
      <a href="privacy_settings_mockup.html">Privacy Settings</a>
    </nav>
  </div>
</body>
</html>
