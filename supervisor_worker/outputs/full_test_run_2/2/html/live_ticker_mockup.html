<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Ticker</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
      --color-border: #dee2e6;
      --color-error: #dc3545;
      --color-card: #fff;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      margin: 0;
    }
    header {
      background: var(--color-primary);
      color: #fff;
      padding: 1rem;
      text-align: center;
    }
    .ticker-list {
      max-width: 600px;
      margin: 2rem auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    article.ticker-card {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      position: relative;
    }
    .match-title {
      font-size: 1.1rem;
      color: var(--color-primary);
      margin-bottom: 0.5rem;
    }
    .match-meta {
      font-size: 0.9rem;
      color: #6c757d;
      margin-bottom: 0.5rem;
    }
    .match-score {
      font-size: 1.2rem;
      color: var(--color-text);
      margin-bottom: 1rem;
    }
    .offline-indicator {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: #ffc107;
      color: #212529;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.85rem;
    }
    .error {
      color: var(--color-error);
      text-align: center;
      margin-top: 2rem;
      font-size: 1rem;
    }
    .nav {
      margin-top: 2rem;
      text-align: center;
    }
    .nav a {
      color: var(--color-primary);
      text-decoration: none;
      margin: 0 0.5rem;
      font-size: 0.95rem;
    }
    .nav a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h1>Live Ticker</h1>
  </header>
  <div class="ticker-list" aria-label="Live Match Results">
    <article class="ticker-card" aria-labelledby="match1-title">
      <div class="match-title" id="match1-title">Team A vs Team B</div>
      <div class="match-meta">Live • 60'</div>
      <div class="match-score">2 - 1</div>
    </article>
    <article class="ticker-card" aria-labelledby="match2-title">
      <div class="match-title" id="match2-title">Team C vs Team D</div>
      <div class="match-meta">FT</div>
      <div class="match-score">0 - 0</div>
      <div class="offline-indicator">Offline: Showing cached results</div>
    </article>
    <!-- Error/empty state -->
    <div class="error" style="display:none;">No live matches for your favorite teams.</div>
  </div>
  <nav class="nav" aria-label="Main Navigation">
    <a href="main_dashboard_mockup.html">Back to Dashboard</a>
    <a href="match_stream_mockup.html">Streams</a>
  </nav>
</body>
</html>
