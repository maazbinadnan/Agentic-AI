<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notification Settings</title>
  <style>
    :root {
      --primary: #0d6efd;
      --gray-light: #f8f9fa;
      --gray-dark: #212529;
      --border: #dee2e6;
    }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--gray-light); color: var(--gray-dark); margin: 0; }
    main { max-width: 500px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #0001; padding: 32px; }
    h1 { font-size: 1.5rem; margin-bottom: 24px; }
    .toggle-list { display: flex; flex-direction: column; gap: 16px; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; background: var(--gray-light); border: 1px solid var(--border); border-radius: 4px; padding: 12px 16px; }
    .toggle-label { font-weight: 500; }
    .toggle-switch { width: 40px; height: 24px; background: var(--border); border-radius: 12px; position: relative; cursor: pointer; }
    .toggle-switch[data-enabled="true"] { background: var(--primary); }
    .toggle-knob { width: 20px; height: 20px; background: #fff; border-radius: 50%; position: absolute; top: 2px; left: 2px; transition: left 0.2s; }
    .toggle-switch[data-enabled="true"] .toggle-knob { left: 18px; }
    .preview { margin-top: 24px; background: var(--gray-light); border: 1px solid var(--border); border-radius: 4px; padding: 16px; font-size: 0.95rem; color: #555; }
  </style>
</head>
<body>
  <main>
    <h1>Notification Settings</h1>
    <div class="toggle-list">
      <div class="toggle-row">
        <span class="toggle-label">Goals</span>
        <div class="toggle-switch" data-enabled="true">
          <div class="toggle-knob"></div>
        </div>
      </div>
      <div class="toggle-row">
        <span class="toggle-label">News</span>
        <div class="toggle-switch" data-enabled="false">
          <div class="toggle-knob"></div>
        </div>
      </div>
      <div class="toggle-row">
        <span class="toggle-label">Match Start/End</span>
        <div class="toggle-switch" data-enabled="true">
          <div class="toggle-knob"></div>
        </div>
      </div>
    </div>
    <div class="preview">
      <strong>Sample Notification:</strong> Goal! Manchester United scores against Liverpool.
    </div>
  </main>
</body>
</html>
