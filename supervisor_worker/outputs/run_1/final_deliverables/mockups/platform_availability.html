<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Platform Availability</title>
  <style>
    :root {
      --primary: #0d6efd;
      --gray-light: #f8f9fa;
      --gray-dark: #212529;
      --border: #dee2e6;
    }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--gray-light); color: var(--gray-dark); margin: 0; }
    main { max-width: 400px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #0001; padding: 32px; }
    h1 { font-size: 1.5rem; margin-bottom: 24px; }
    .platforms { display: flex; gap: 16px; margin-bottom: 24px; }
    .badge { background: var(--primary); color: #fff; border-radius: 4px; padding: 8px 16px; font-size: 1rem; }
    .store-links { display: flex; flex-direction: column; gap: 8px; }
    .store-link { color: var(--primary); text-decoration: underline; font-size: 1rem; }
    .info { font-size: 0.95rem; color: #555; margin-top: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>Platform Availability</h1>
    <div class="platforms">
      <div class="badge">Android</div>
      <div class="badge">iOS</div>
    </div>
    <div class="store-links">
      <a class="store-link" href="#">Google Play Store</a>
      <a class="store-link" href="#">Apple App Store</a>
    </div>
    <div class="info">Search for 'LiveFootball' to install on your device.</div>
  </main>
</body>
</html>
