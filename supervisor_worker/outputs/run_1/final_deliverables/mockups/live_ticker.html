<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Ticker</title>
  <style>
    :root {
      --primary: #0d6efd;
      --gray-light: #f8f9fa;
      --gray-dark: #212529;
      --border: #dee2e6;
      --live: #28a745;
    }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--gray-light); color: var(--gray-dark); margin: 0; }
    main { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #0001; padding: 32px; }
    h1 { font-size: 1.5rem; margin-bottom: 24px; }
    .ticker-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .live-indicator { width: 12px; height: 12px; background: var(--live); border-radius: 50%; display: inline-block; }
    .match-list { display: flex; flex-direction: column; gap: 12px; }
    .match { background: var(--gray-light); border: 1px solid var(--border); border-radius: 4px; padding: 12px; }
    .match-title { font-weight: 600; margin-bottom: 4px; }
    .match-update { font-size: 0.95rem; color: #555; }
  </style>
</head>
<body>
  <main>
    <h1>Live Ticker</h1>
    <div class="ticker-header">
      <span class="live-indicator"></span>
      <span>Live Updates</span>
    </div>
    <div class="match-list">
      <div class="match">
        <div class="match-title">Manchester United vs Liverpool</div>
        <div class="match-update">45' - Goal! Rashford scores for Manchester United.</div>
        <div class="match-update">60' - Yellow card for Liverpool.</div>
        <div class="match-update">75' - Substitution: Fernandes in.</div>
      </div>
      <div class="match">
        <div class="match-title">Real Madrid vs Barcelona</div>
        <div class="match-update">30' - Goal! Benzema scores for Real Madrid.</div>
        <div class="match-update">50' - Red card for Barcelona.</div>
      </div>
    </div>
  </main>
</body>
</html>
