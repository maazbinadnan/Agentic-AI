<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Splash & Loading</title>
  <style>
    :root {
      --primary: #0d6efd;
      --gray-light: #f8f9fa;
      --gray-dark: #212529;
    }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--primary); color: #fff; margin: 0; }
    main { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
    .logo { font-size: 2rem; font-weight: 700; margin-bottom: 32px; }
    .spinner { width: 48px; height: 48px; border: 6px solid #fff; border-top: 6px solid var(--gray-light); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 24px; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .loading-text { font-size: 1.1rem; margin-bottom: 8px; }
    .timer { font-size: 0.95rem; color: var(--gray-light); }
  </style>
</head>
<body>
  <main>
    <div class="logo">LiveFootball</div>
    <div class="spinner"></div>
    <div class="loading-text">Loading...</div>
    <div class="timer">Ready in &lt;2 seconds</div>
  </main>
</body>
</html>
