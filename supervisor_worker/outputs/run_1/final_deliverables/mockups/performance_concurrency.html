<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Performance & Concurrency</title>
  <style>
    :root {
      --primary: #0d6efd;
      --gray-light: #f8f9fa;
      --gray-dark: #212529;
      --border: #dee2e6;
      --success: #28a745;
    }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--gray-light); color: var(--gray-dark); margin: 0; }
    main { max-width: 500px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #0001; padding: 32px; }
    h1 { font-size: 1.5rem; margin-bottom: 24px; }
    .performance-banner { background: var(--success); color: #fff; padding: 12px; border-radius: 4px; margin-bottom: 24px; font-weight: 500; }
    .concurrency-info { font-size: 1rem; color: #555; }
  </style>
</head>
<body>
  <main>
    <div class="performance-banner">App is responsive with 100,000 users online.</div>
    <h1>Performance & Concurrency</h1>
    <div class="concurrency-info">Current online users: 98,500</div>
    <div class="concurrency-info">No performance degradation detected.</div>
  </main>
</body>
</html>
