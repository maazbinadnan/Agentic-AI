<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login & Registration</title>
  <style>
    :root {
      --primary: #0d6efd;
      --gray-light: #f8f9fa;
      --gray-dark: #212529;
      --border: #dee2e6;
      --error: #dc3545;
    }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--gray-light); color: var(--gray-dark); margin: 0; }
    main { max-width: 400px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #0001; padding: 32px; }
    h1 { font-size: 1.5rem; margin-bottom: 24px; }
    form { display: flex; flex-direction: column; gap: 16px; }
    label { font-weight: 500; margin-bottom: 4px; }
    input { padding: 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 1rem; }
    .error-msg { color: var(--error); font-size: 0.95rem; margin-top: 4px; }
    .btn { background: var(--primary); color: #fff; border: none; border-radius: 4px; padding: 10px 20px; font-size: 1rem; cursor: pointer; }
    .social-login { display: flex; gap: 12px; margin-top: 8px; }
    .social-btn { background: var(--gray-light); color: var(--primary); border: 1px solid var(--primary); border-radius: 4px; padding: 8px 16px; cursor: pointer; font-size: 0.95rem; }
  </style>
</head>
<body>
  <main>
    <h1>Login / Register</h1>
    <form>
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your email">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password">
      <div class="error-msg" style="display:none;">Invalid email or password.</div>
      <button class="btn" type="submit">Login</button>
    </form>
    <div style="margin: 16px 0; text-align: center;">or</div>
    <div class="social-login">
      <button class="social-btn">Google</button>
      <button class="social-btn">Apple</button>
      <button class="social-btn">Facebook</button>
    </div>
    <form style="margin-top: 24px;">
      <label for="reg-email">Register with Email</label>
      <input type="email" id="reg-email" placeholder="Enter your email">
      <label for="reg-password">Password</label>
      <input type="password" id="reg-password" placeholder="Create a password">
      <button class="btn" type="submit">Register</button>
    </form>
  </main>
</body>
</html>
