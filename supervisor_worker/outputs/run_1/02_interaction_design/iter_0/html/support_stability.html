<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Support & Stability</title>
  <style>
    :root {
      --primary: #0d6efd;
      --gray-light: #f8f9fa;
      --gray-dark: #212529;
      --border: #dee2e6;
      --error: #dc3545;
    }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--gray-light); color: var(--gray-dark); margin: 0; }
    main { max-width: 500px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #0001; padding: 32px; }
    h1 { font-size: 1.5rem; margin-bottom: 24px; }
    .support-section { background: var(--gray-light); border: 1px solid var(--border); border-radius: 4px; padding: 16px; margin-bottom: 24px; }
    .support-links { display: flex; flex-direction: column; gap: 8px; }
    .support-link { color: var(--primary); text-decoration: underline; font-size: 1rem; }
    .stability-info { font-size: 0.95rem; color: #555; margin-top: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>Support & Stability</h1>
    <section class="support-section">
      <h2>Support Resources</h2>
      <div class="support-links">
        <a class="support-link" href="#">Help Center</a>
        <a class="support-link" href="#">Contact Support</a>
        <a class="support-link" href="#">FAQ</a>
      </div>
    </section>
    <div class="stability-info">App has been thoroughly tested to minimize malfunctions.</div>
  </main>
</body>
</html>
