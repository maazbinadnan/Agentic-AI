<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Stream</title>
  <style>
    :root {
      --primary: #0d6efd;
      --gray-light: #f8f9fa;
      --gray-dark: #212529;
      --border: #dee2e6;
      --error: #dc3545;
    }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--gray-light); color: var(--gray-dark); margin: 0; }
    main { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #0001; padding: 32px; }
    h1 { font-size: 1.5rem; margin-bottom: 24px; }
    .stream-panel { background: var(--gray-light); border: 1px solid var(--border); border-radius: 6px; padding: 24px; margin-bottom: 16px; }
    .stream-link { background: var(--primary); color: #fff; border: none; border-radius: 4px; padding: 12px 24px; font-size: 1rem; cursor: pointer; }
    .unavailable-msg { color: var(--error); font-size: 1rem; margin-top: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Live Stream</h1>
    <div class="stream-panel">
      <div>Match: Manchester United vs Liverpool</div>
      <button class="stream-link">Watch Live Stream</button>
    </div>
    <div class="stream-panel">
      <div>Match: Real Madrid vs Barcelona</div>
      <div class="unavailable-msg">Live stream not available in your country due to broadcast rights.</div>
    </div>
  </main>
</body>
</html>
