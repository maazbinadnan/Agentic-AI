<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Registration & Login</title>
  <style>
    :root {
      --primary: #0d6efd;
      --gray-light: #f8f9fa;
      --gray-dark: #212529;
      --border: #dee2e6;
      --error: #dc3545;
      --success: #198754;
      --font: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      font-family: var(--font);
      background: var(--gray-light);
      color: var(--gray-dark);
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 400px;
      margin: 40px auto;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      padding: 32px 24px;
      border: 1px solid var(--border);
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 16px;
      text-align: center;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-weight: 500;
    }
    input[type="text"], input[type="email"], input[type="password"] {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 1rem;
      background: var(--gray-light);
    }
    .btn {
      width: 100%;
      padding: 10px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .btn-social {
      background: #fff;
      color: var(--gray-dark);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .error {
      color: var(--error);
      font-size: 0.95rem;
      margin-bottom: 8px;
    }
    .gdpr-consent {
      background: var(--gray-light);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 16px;
      font-size: 0.95rem;
    }
    .forgot {
      text-align: right;
      font-size: 0.95rem;
      color: var(--primary);
      cursor: pointer;
    }
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: #fff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      min-width: 320px;
    }
    .modal-content .btn {
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome to Football App</h1>
    <form>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password">
      </div>
      <div class="error" style="display:none;">Password must be at least 8 characters, include a number and a capital letter.</div>
      <button class="btn" type="submit">Log In</button>
      <div class="forgot" onclick="document.getElementById('modal').style.display='flex'">Forgot password?</div>
    </form>
    <div style="margin: 16px 0; text-align:center;">or</div>
    <button class="btn btn-social"><span>🔵</span> Log in with Facebook</button>
    <button class="btn btn-social"><span>🟢</span> Log in with Google</button>
    <button class="btn btn-social"><span>🍏</span> Log in with Apple</button>
    <div class="gdpr-consent">
      <input type="checkbox" id="gdpr" checked>
      <label for="gdpr">I consent to the processing of my personal data in accordance with GDPR.</label>
    </div>
    <button class="btn" style="background:var(--success);">Register</button>
  </div>
  <!-- Password Recovery Modal -->
  <div class="modal" id="modal" style="display:none;">
    <div class="modal-content">
      <h2>Password Recovery</h2>
      <div class="form-group">
        <label for="recover-email">Email</label>
        <input type="email" id="recover-email" placeholder="Enter your email">
      </div>
      <button class="btn" style="background:var(--primary);">Send Recovery Email</button>
      <div style="margin-top:8px; color:var(--gray-dark); font-size:0.95rem;">Instructions will be sent to your email.</div>
      <button class="btn" style="background:var(--error);" onclick="document.getElementById('modal').style.display='none'">Close</button>
    </div>
  </div>
</body>
</html>
