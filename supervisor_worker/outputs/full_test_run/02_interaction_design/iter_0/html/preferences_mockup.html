<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Preferences - Favorite Teams & Channels</title>
  <style>
    :root {
      --primary: #0d6efd;
      --gray-light: #f8f9fa;
      --gray-dark: #212529;
      --border: #dee2e6;
      --error: #dc3545;
      --font: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      font-family: var(--font);
      background: var(--gray-light);
      color: var(--gray-dark);
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      padding: 32px 24px;
      border: 1px solid var(--border);
    }
    h2 {
      font-size: 1.3rem;
      margin-bottom: 24px;
      text-align: center;
    }
    .section {
      margin-bottom: 24px;
    }
    .teams-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .team-card {
      background: var(--gray-light);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: border 0.2s;
    }
    .team-card.selected {
      border: 2px solid var(--primary);
      background: #e7f1ff;
    }
    .channels-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .channel-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--gray-light);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px 12px;
      cursor: pointer;
    }
    .channel-item.selected {
      border: 2px solid var(--primary);
      background: #e7f1ff;
    }
    .btn {
      width: 100%;
      padding: 10px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 16px;
    }
    .error {
      color: var(--error);
      font-size: 0.95rem;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Set Your Preferences</h2>
    <div class="section">
      <label style="font-weight:600;">Select Favorite Teams</label>
      <div class="teams-grid">
        <div class="team-card selected">FC Barcelona</div>
        <div class="team-card">Real Madrid</div>
        <div class="team-card">Manchester United</div>
        <div class="team-card">Liverpool</div>
        <div class="team-card">Bayern Munich</div>
        <div class="team-card">Juventus</div>
        <div class="team-card">Paris SG</div>
        <div class="team-card">Chelsea</div>
      </div>
    </div>
    <div class="section">
      <label style="font-weight:600;">Select Sports Channels</label>
      <div class="channels-list">
        <div class="channel-item selected">ESPN</div>
        <div class="channel-item">Sky Sports</div>
        <div class="channel-item">beIN Sports</div>
        <div class="channel-item">DAZN</div>
      </div>
    </div>
    <button class="btn">Save Preferences</button>
    <div class="error" style="display:none;">Please select at least one team and one channel.</div>
  </div>
</body>
</html>
