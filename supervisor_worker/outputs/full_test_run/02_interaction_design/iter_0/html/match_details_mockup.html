<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Match Details & Live Stream</title>
  <style>
    :root {
      --primary: #0d6efd;
      --gray-light: #f8f9fa;
      --gray-dark: #212529;
      --border: #dee2e6;
      --error: #dc3545;
      --font: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      font-family: var(--font);
      background: var(--gray-light);
      color: var(--gray-dark);
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      padding: 32px 24px;
      border: 1px solid var(--border);
    }
    h2 {
      font-size: 1.3rem;
      margin-bottom: 24px;
      text-align: center;
    }
    .match-info {
      margin-bottom: 24px;
    }
    .stream-link {
      display: block;
      background: var(--primary);
      color: #fff;
      padding: 12px;
      border-radius: 4px;
      text-align: center;
      text-decoration: none;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .alert {
      background: #fff3f3;
      color: var(--error);
      border: 1px solid var(--error);
      border-radius: 4px;
      padding: 12px;
      margin-bottom: 16px;
      text-align: center;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Match Details</h2>
    <div class="match-info">
      <div style="font-weight:600;">Barcelona vs Real Madrid</div>
      <div style="color:#6c757d;">La Liga | 2024-05-12 | 20:00</div>
      <div style="margin-top:8px;">Status: In Progress</div>
      <div style="margin-top:8px;">Score: 2 - 1</div>
    </div>
    <!-- Live stream available -->
    <a class="stream-link" href="#">Watch Live Stream</a>
    <!-- No rights for live stream -->
    <div class="alert" style="display:none;">Live stream not available in your country due to broadcast rights.</div>
  </div>
</body>
</html>
