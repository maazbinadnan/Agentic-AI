<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>App Performance & Launch</title>
  <style>
    :root {
      --primary: #0d6efd;
      --gray-light: #f8f9fa;
      --gray-dark: #212529;
      --border: #dee2e6;
      --error: #dc3545;
      --font: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      font-family: var(--font);
      background: var(--gray-light);
      color: var(--gray-dark);
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 400px;
      margin: 80px auto;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      padding: 32px 24px;
      border: 1px solid var(--border);
      text-align: center;
    }
    .splash {
      font-size: 2rem;
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 24px;
    }
    .status {
      font-size: 1rem;
      color: #6c757d;
      margin-bottom: 16px;
    }
    .performance {
      font-size: 1.1rem;
      color: var(--success);
      margin-bottom: 16px;
    }
    .error {
      color: var(--error);
      font-size: 0.95rem;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="splash">Football App</div>
    <div class="status">Loading... (Expected: &lt;2s)</div>
    <div class="performance">App is fully loaded and ready.</div>
    <div class="status">Peak Usage: 100,000 users online</div>
    <div class="performance">App remains responsive.</div>
    <div class="error" style="display:none;">App failed to load. Please try again.</div>
  </div>
</body>
</html>
