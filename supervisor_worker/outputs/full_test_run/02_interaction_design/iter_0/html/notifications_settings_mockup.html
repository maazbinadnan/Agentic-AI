<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notification Settings</title>
  <style>
    :root {
      --primary: #0d6efd;
      --gray-light: #f8f9fa;
      --gray-dark: #212529;
      --border: #dee2e6;
      --error: #dc3545;
      --font: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      font-family: var(--font);
      background: var(--gray-light);
      color: var(--gray-dark);
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 500px;
      margin: 40px auto;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      padding: 32px 24px;
      border: 1px solid var(--border);
    }
    h2 {
      font-size: 1.3rem;
      margin-bottom: 24px;
      text-align: center;
    }
    .settings-section {
      margin-bottom: 24px;
    }
    .toggle-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .toggle {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toggle input[type="checkbox"] {
      accent-color: var(--primary);
    }
    .quiet-hours {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
    }
    .btn {
      width: 100%;
      padding: 10px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 16px;
    }
    .error {
      color: var(--error);
      font-size: 0.95rem;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Notification Settings</h2>
    <div class="settings-section">
      <div class="toggle-group">
        <div class="toggle">
          <input type="checkbox" id="news" checked>
          <label for="news">News Notifications</label>
        </div>
        <div class="toggle">
          <input type="checkbox" id="results" checked>
          <label for="results">Results Notifications</label>
        </div>
        <div class="toggle">
          <input type="checkbox" id="live" checked>
          <label for="live">Live Match Alerts</label>
        </div>
      </div>
      <div class="quiet-hours">
        <label for="quiet-start">Quiet Hours:</label>
        <input type="time" id="quiet-start" value="22:00"> to
        <input type="time" id="quiet-end" value="07:00">
      </div>
    </div>
    <button class="btn">Save Notification Settings</button>
    <div class="error" style="display:none;">Please select at least one notification type.</div>
  </div>
</body>
</html>
