<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration & Login Wireframe - US-002</title>
  <style>
    :root {
      --bg-color: #f4f5f7;
      --card-bg: #fff;
      --text-color: #172b4d;
      --border-color: #dfe1e6;
      --primary-color: #0052cc;
      --error-color: #dc3545;
      --success-color: #36b37e;
      --input-bg: #f9fafb;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    main {
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(23,43,77,0.04);
      padding: 32px 24px 24px 24px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 16px 0;
      text-align: center;
    }
    .tabs {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }
    .tab {
      padding: 8px 24px;
      border: none;
      background: none;
      font-size: 1rem;
      color: var(--text-color);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: border-color 0.2s;
    }
    .tab.active {
      border-bottom: 2px solid var(--primary-color);
      color: var(--primary-color);
      font-weight: 600;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    label {
      font-size: 0.95rem;
      margin-bottom: 4px;
    }
    input[type="text"],
    input[type="email"],
    input[type="password"] {
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: var(--input-bg);
      font-size: 1rem;
      color: var(--text-color);
    }
    .input-group {
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .toggle-password {
      position: absolute;
      right: 10px;
      top: 34px;
      background: none;
      border: none;
      color: var(--primary-color);
      cursor: pointer;
      font-size: 0.95rem;
      padding: 0;
    }
    .error-message {
      color: var(--error-color);
      font-size: 0.95rem;
      margin-top: 4px;
    }
    .success-message {
      color: var(--success-color);
      font-size: 0.95rem;
      margin-top: 4px;
    }
    button[type="submit"] {
      background: var(--primary-color);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 12px 0;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    button[type="submit"]:hover {
      background: #0747a6;
    }
    .form-footer {
      text-align: center;
      margin-top: 16px;
      font-size: 0.95rem;
      color: #6b778c;
    }
    @media (max-width: 480px) {
      .card {
        padding: 20px 8px 16px 8px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>Welcome</h1>
      <nav class="tabs" aria-label="Registration and Login Tabs">
        <button class="tab active" aria-selected="true" aria-controls="register-form" id="register-tab">Register</button>
        <button class="tab" aria-selected="false" aria-controls="login-form" id="login-tab">Login</button>
      </nav>
      <!-- Registration Form (Default State) -->
      <form id="register-form" autocomplete="off">
        <div class="input-group">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" name="reg-email" placeholder="you@email.com" required>
        </div>
        <div class="input-group">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" name="reg-password" placeholder="Create a password" required>
          <button type="button" class="toggle-password" aria-label="Show password">Show</button>
        </div>
        <div class="input-group">
          <label for="reg-confirm">Confirm Password</label>
          <input type="password" id="reg-confirm" name="reg-confirm" placeholder="Repeat password" required>
        </div>
        <!-- Error State Example -->
        <div class="error-message" style="display:none;" id="reg-error">
          Passwords do not match or email is invalid.
        </div>
        <!-- Success State Example -->
        <div class="success-message" style="display:none;" id="reg-success">
          Registration successful! Logging you in...
        </div>
        <button type="submit">Register</button>
      </form>
      <!-- Login Form (Hidden by Default) -->
      <form id="login-form" style="display:none;" autocomplete="off">
        <div class="input-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="login-email" placeholder="you@email.com" required>
        </div>
        <div class="input-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="login-password" placeholder="Your password" required>
          <button type="button" class="toggle-password" aria-label="Show password">Show</button>
        </div>
        <!-- Error State Example -->
        <div class="error-message" style="display:none;" id="login-error">
          Incorrect email or password.
        </div>
        <button type="submit">Login</button>
      </form>
      <div class="form-footer">
        By registering, you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.
      </div>
    </section>
    <footer style="text-align:center; color:#6b778c; font-size:0.9rem;">
      <em>Wireframe: Registration & Login (US-002) – Default, Success, and Error States</em>
    </footer>
  </main>
  <!--
    Interactive State Annotations:
    - Default: Registration form visible, no error.
    - Error: Show .error-message div.
    - Success: Show .success-message div.
    - Login: Switch to login form via tab.
    - Password visibility: Toggle input type.
  -->
</body>
</html>
