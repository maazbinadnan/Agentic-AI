<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration & Login Wireframe - US-002</title>
  <style>
    :root {
      --bg-color: #f4f5f7;
      --card-bg: #ffffff;
      --text-color: #172b4d;
      --border-color: #dfe1e6;
      --primary-color: #0052cc;
      --error-color: #dc3545;
      --input-bg: #f8f9fa;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .auth-container {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(23,43,77,0.06);
      padding: 40px 32px 32px 32px;
      min-width: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .auth-tabs {
      display: flex;
      width: 100%;
      margin-bottom: 24px;
    }
    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 10px 0;
      cursor: pointer;
      font-weight: 500;
      border-bottom: 2px solid transparent;
      color: #6b778c;
      background: none;
      outline: none;
      transition: border-color 0.2s, color 0.2s;
    }
    .auth-tab.active {
      border-bottom: 2px solid var(--primary-color);
      color: var(--primary-color);
    }
    form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    label {
      font-size: 0.98rem;
      margin-bottom: 4px;
      font-weight: 500;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    input[type="text"],
    input[type="email"],
    input[type="password"] {
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--input-bg);
      font-size: 1rem;
      color: var(--text-color);
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: var(--primary-color);
    }
    .input-error input {
      border-color: var(--error-color);
    }
    .error-message {
      color: var(--error-color);
      font-size: 0.95rem;
      margin-top: 2px;
    }
    .toggle-password {
      position: relative;
      display: flex;
      align-items: center;
    }
    .toggle-password input {
      flex: 1;
    }
    .toggle-btn {
      background: none;
      border: none;
      color: #6b778c;
      font-size: 1rem;
      cursor: pointer;
      margin-left: -32px;
      z-index: 2;
      outline: none;
    }
    .auth-btn {
      background: var(--primary-color);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 12px 0;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .auth-btn:active {
      background: #003380;
    }
    .auth-footer {
      margin-top: 18px;
      font-size: 0.95rem;
      color: #6b778c;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <section class="auth-container" aria-label="Registration and Login">
      <nav class="auth-tabs" aria-label="Auth Tabs">
        <button class="auth-tab active" aria-selected="true" aria-controls="register-form" id="register-tab">Register</button>
        <button class="auth-tab" aria-selected="false" aria-controls="login-form" id="login-tab">Login</button>
      </nav>
      <!-- Registration Form (Default State) -->
      <form id="register-form" autocomplete="off" aria-labelledby="register-tab">
        <div class="input-group">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" name="reg-email" placeholder="you@email.com" required>
        </div>
        <div class="input-group">
          <label for="reg-password">Password</label>
          <div class="toggle-password">
            <input type="password" id="reg-password" name="reg-password" placeholder="Create password" required>
            <button type="button" class="toggle-btn" aria-label="Show password">👁️</button>
          </div>
        </div>
        <div class="input-group">
          <label for="reg-confirm">Confirm Password</label>
          <input type="password" id="reg-confirm" name="reg-confirm" placeholder="Repeat password" required>
        </div>
        <button type="submit" class="auth-btn">Register & Log In</button>
      </form>
      <!-- Registration Form (Error State Example) -->
      <form id="register-form-error" style="display:none;" aria-labelledby="register-tab">
        <div class="input-group input-error">
          <label for="reg-email-err">Email</label>
          <input type="email" id="reg-email-err" name="reg-email-err" value="bademail" required>
          <span class="error-message">Please enter a valid email address.</span>
        </div>
        <div class="input-group input-error">
          <label for="reg-password-err">Password</label>
          <div class="toggle-password">
            <input type="password" id="reg-password-err" name="reg-password-err" value="123" required>
            <button type="button" class="toggle-btn" aria-label="Show password">👁️</button>
          </div>
          <span class="error-message">Password must be at least 8 characters.</span>
        </div>
        <div class="input-group input-error">
          <label for="reg-confirm-err">Confirm Password</label>
          <input type="password" id="reg-confirm-err" name="reg-confirm-err" value="12" required>
          <span class="error-message">Passwords do not match.</span>
        </div>
        <button type="submit" class="auth-btn">Register & Log In</button>
      </form>
      <!-- Login Form (Hidden by default) -->
      <form id="login-form" style="display:none;" autocomplete="off" aria-labelledby="login-tab">
        <div class="input-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="login-email" placeholder="you@email.com" required>
        </div>
        <div class="input-group">
          <label for="login-password">Password</label>
          <div class="toggle-password">
            <input type="password" id="login-password" name="login-password" placeholder="Your password" required>
            <button type="button" class="toggle-btn" aria-label="Show password">👁️</button>
          </div>
        </div>
        <button type="submit" class="auth-btn">Log In</button>
      </form>
      <div class="auth-footer">By continuing, you agree to our <a href="#" tabindex="0">Terms</a>.</div>
    </section>
  </main>
  <!-- State annotation: Toggle between Register/Login. Error state shown for failed registration. Password visibility toggle present. -->
</body>
</html>
