<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Startup Splash Wireframe - US-001</title>
  <style>
    :root {
      --bg-color: #f4f5f7;
      --card-bg: #ffffff;
      --text-color: #172b4d;
      --border-color: #dfe1e6;
      --primary-color: #0052cc;
      --accent-color: #0d6efd;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .splash-container {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(23,43,77,0.06);
      padding: 48px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 320px;
      min-height: 220px;
    }
    .app-logo {
      width: 64px;
      height: 64px;
      background: var(--primary-color);
      border-radius: 50%;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: 2px;
    }
    .splash-title {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }
    .splash-loader {
      margin: 24px 0 0 0;
      width: 48px;
      height: 48px;
      border: 5px solid var(--border-color);
      border-top: 5px solid var(--accent-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .splash-note {
      margin-top: 24px;
      font-size: 0.95rem;
      color: #6b778c;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <section class="splash-container" aria-label="App Startup Splash">
      <div class="app-logo" aria-label="App Logo">⚽</div>
      <div class="splash-title">Football Now</div>
      <div class="splash-loader" aria-label="Loading indicator"></div>
      <div class="splash-note">Loading... Ready in under 2 seconds</div>
    </section>
  </main>
  <!-- State annotation: This is the cold/warm startup splash, per US-001. -->
</body>
</html>
