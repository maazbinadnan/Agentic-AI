<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Stream Link (US-005)</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
      --color-border: #dee2e6;
      --color-muted: #6c757d;
      --color-success: #198754;
    }
    body {
      margin: 0;
      background: var(--color-bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--color-text);
    }
    header {
      background: var(--color-primary);
      color: #fff;
      padding: 1rem 1.5rem;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .match-container {
      max-width: 500px;
      margin: 2rem auto;
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(33,37,41,0.04);
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .match-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 1.1rem;
      font-weight: 600;
    }
    .live-badge {
      background: var(--color-success);
      color: #fff;
      border-radius: 4px;
      padding: 0.25rem 0.75rem;
      font-size: 0.95rem;
      font-weight: 500;
      margin-left: 0.5rem;
    }
    .stream-link {
      display: inline-block;
      background: var(--color-primary);
      color: #fff;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: 600;
      transition: background 0.15s;
      margin-top: 0.5rem;
    }
    .stream-link:hover, .stream-link:focus {
      background: #0b5ed7;
      outline: none;
    }
    .no-stream {
      color: var(--color-muted);
      font-size: 1.1rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <header>Football Live &ndash; Match Center</header>
  <main class="match-container" aria-label="Live stream link">
    <!-- Rights fulfilled: Show stream link -->
    <div class="match-header">
      Manchester United vs Real Madrid
      <span class="live-badge">LIVE</span>
    </div>
    <a href="#" class="stream-link" aria-label="Watch live stream">Watch Live Stream</a>
    <!-- Rights not fulfilled: Hide stream link, show message -->
    <!--
    <div class="match-header">
      Manchester United vs Real Madrid
      <span class="live-badge">LIVE</span>
    </div>
    <div class="no-stream">
      Live stream not available in your country.
    </div>
    -->
  </main>
</body>
</html>
