<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Media Sharing (US-008)</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
      --color-border: #dee2e6;
      --color-muted: #6c757d;
    }
    body {
      margin: 0;
      background: var(--color-bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--color-text);
    }
    .article-container {
      max-width: 500px;
      margin: 2rem auto;
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(33,37,41,0.04);
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .article-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .article-meta {
      color: var(--color-muted);
      font-size: 0.98rem;
      margin-bottom: 0.5rem;
    }
    .article-content {
      font-size: 1rem;
      color: var(--color-text);
      margin-bottom: 1rem;
    }
    .share-btn {
      display: inline-block;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .share-btn:hover, .share-btn:focus {
      background: #0b5ed7;
      outline: none;
    }
    .share-success {
      color: var(--color-primary);
      font-size: 1rem;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <main class="article-container" aria-label="News article">
    <div class="article-title">Manchester United clinch dramatic win in stoppage time</div>
    <div class="article-meta">Sky Sports &middot; 2h ago</div>
    <div class="article-content">A thrilling finish at Old Trafford saw United secure three points with a last-minute goal. Read more...</div>
    <button class="share-btn" aria-label="Share article">Share</button>
    <!-- Success State: Share dialog opened -->
    <!-- <div class="share-success">Share dialog opened.</div> -->
  </main>
  <!-- Game report sharing would use the same pattern -->
</body>
</html>
