<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Ticker Updates (US-003)</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
      --color-border: #dee2e6;
      --color-muted: #6c757d;
      --color-success: #198754;
    }
    body {
      margin: 0;
      background: var(--color-bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--color-text);
    }
    header {
      background: var(--color-primary);
      color: #fff;
      padding: 1rem 1.5rem;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .ticker-container {
      max-width: 500px;
      margin: 2rem auto;
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(33,37,41,0.04);
      padding: 1.5rem 1rem;
    }
    .ticker-header {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .live-dot {
      width: 10px;
      height: 10px;
      background: var(--color-success);
      border-radius: 50%;
      display: inline-block;
      animation: blink 1s infinite alternate;
    }
    @keyframes blink {
      0% { opacity: 1; }
      100% { opacity: 0.3; }
    }
    .ticker-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .ticker-event {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      font-size: 1rem;
      border-left: 3px solid var(--color-primary);
      padding-left: 0.75rem;
    }
    .ticker-time {
      color: var(--color-muted);
      font-size: 0.95rem;
      min-width: 48px;
    }
    .no-live-matches {
      text-align: center;
      color: var(--color-muted);
      font-size: 1.1rem;
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <header>
    Football Live
    <span style="font-size:1rem;font-weight:400;">Live Ticker</span>
  </header>
  <main class="ticker-container" aria-label="Live ticker updates">
    <!-- Populated State: Live match in progress -->
    <div class="ticker-header">
      <span class="live-dot" aria-label="Live"></span>
      <span>Manchester United vs Real Madrid</span>
      <span style="margin-left:auto;color:var(--color-muted);font-size:0.95rem;">2 - 1, 78'</span>
    </div>
    <ul class="ticker-list">
      <li class="ticker-event">
        <span class="ticker-time">77'</span>
        <span><strong>Goal!</strong> Rashford scores for Manchester United. <span style="color:var(--color-success);">[2-1]</span></span>
      </li>
      <li class="ticker-event">
        <span class="ticker-time">65'</span>
        <span><strong>Yellow Card</strong> for Casemiro (Real Madrid).</span>
      </li>
      <li class="ticker-event">
        <span class="ticker-time">60'</span>
        <span><strong>Substitution:</strong> Modric in, Kroos out (Real Madrid).</span>
      </li>
    </ul>
    <!-- Empty State: No live matches for favorites -->
    <!--
    <div class="no-live-matches">
      No live matches for your favorite teams right now.
    </div>
    -->
  </main>
</body>
</html>
