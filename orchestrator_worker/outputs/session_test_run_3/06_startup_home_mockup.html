<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football App - Fast Launch (US-001)</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
      --color-border: #dee2e6;
      --color-error: #dc3545;
      --color-success: #198754;
      --color-muted: #6c757d;
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      width: 100%;
    }
    .app-logo {
      width: 64px;
      height: 64px;
      background: var(--color-primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 2.5rem;
      font-weight: bold;
      margin-bottom: 1.5rem;
      letter-spacing: 2px;
      box-shadow: 0 2px 8px rgba(13,110,253,0.08);
    }
    .app-title {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      letter-spacing: 1px;
    }
    .loading-indicator {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid var(--color-border);
      border-top: 3px solid var(--color-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    .error-banner {
      background: var(--color-error);
      color: #fff;
      padding: 1rem 1.5rem;
      border-radius: 6px;
      font-size: 1rem;
      margin-top: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 2px 8px rgba(220,53,69,0.08);
    }
    .main-ui {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 400px;
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 2rem 1.5rem;
      box-shadow: 0 2px 8px rgba(33,37,41,0.04);
      margin-top: 2rem;
    }
    .main-ui h2 {
      font-size: 1.25rem;
      margin-bottom: 1rem;
    }
    .main-ui p {
      color: var(--color-muted);
      font-size: 1rem;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <!-- Splash / Loading State -->
  <div class="splash" aria-label="App loading screen">
    <div class="app-logo" aria-label="App logo">⚽</div>
    <div class="app-title">Football Live</div>
    <div class="loading-indicator" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <span>Loading...</span>
    </div>
  </div>

  <!-- Error State (e.g., low memory, failed to load) -->
  
  <div class="error-banner" role="alert">
    <span>⚠️</span>
    <span>Unable to load app due to low memory. Please close other apps and try again.</span>
  </div>
 

  <!-- Main UI (Populated State) -->
  
  <main class="main-ui" aria-label="Main app interface">
    <h2>Welcome, Football Fan!</h2>
    <p>Latest news, live scores, and more at your fingertips.</p>
    <p style="color: var(--color-success);">App loaded in 1.2s</p>
  </main>
 
</body>
</html>
