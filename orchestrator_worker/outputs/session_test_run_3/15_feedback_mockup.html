<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit Feedback (US-010)</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
      --color-border: #dee2e6;
      --color-success: #198754;
      --color-error: #dc3545;
      --color-muted: #6c757d;
    }
    body {
      margin: 0;
      background: var(--color-bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .feedback-container {
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(33,37,41,0.04);
      padding: 2rem 1.5rem;
      max-width: 400px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .feedback-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      text-align: center;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    label {
      font-size: 1rem;
      font-weight: 500;
      margin-bottom: 0.25rem;
    }
    textarea {
      min-height: 80px;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      padding: 0.5rem 0.75rem;
      font-size: 1rem;
      background: var(--color-bg);
      color: var(--color-text);
      resize: vertical;
    }
    .rating-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .star {
      font-size: 1.3rem;
      color: var(--color-border);
      cursor: pointer;
      transition: color 0.15s;
    }
    .star.selected {
      color: var(--color-primary);
    }
    .form-error {
      color: var(--color-error);
      font-size: 0.98rem;
      margin-top: -0.5rem;
      margin-bottom: 0.5rem;
    }
    .form-success {
      color: var(--color-success);
      font-size: 1rem;
      text-align: center;
      margin-bottom: 0.5rem;
    }
    button[type="submit"] {
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 0.75rem 0;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button[type="submit"]:hover, button[type="submit"]:focus {
      background: #0b5ed7;
      outline: none;
    }
  </style>
</head>
<body>
  <section class="feedback-container" aria-label="Submit feedback">
    <div class="feedback-title">We value your feedback</div>
    <form aria-label="Feedback form">
      <label for="feedback-text">Your suggestions</label>
      <textarea id="feedback-text" name="feedback-text" required aria-required="true" placeholder="Let us know how we can improve..."></textarea>
      <div class="rating-group" aria-label="Rate the app">
        <label>Rate the app:</label>
        <span class="star" aria-label="1 star">★</span>
        <span class="star" aria-label="2 stars">★</span>
        <span class="star" aria-label="3 stars">★</span>
        <span class="star" aria-label="4 stars">★</span>
        <span class="star" aria-label="5 stars">★</span>
      </div>
      <button type="submit">Submit</button>
      <!-- Error State -->
      <!-- <div class="form-error">Please enter feedback and select a rating.</div> -->
      <!-- Success State -->
      <!-- <div class="form-success">Thank you for your feedback!</div> -->
    </form>
  </section>
</body>
</html>
