<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team & Player Info (US-004)</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
      --color-border: #dee2e6;
      --color-muted: #6c757d;
      --color-card: #fff;
    }
    body {
      margin: 0;
      background: var(--color-bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--color-text);
    }
    header {
      background: var(--color-primary);
      color: #fff;
      padding: 1rem 1.5rem;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .container {
      max-width: 700px;
      margin: 2rem auto;
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(33,37,41,0.04);
      padding: 2rem 1.5rem;
    }
    .team-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .team-logo {
      width: 48px;
      height: 48px;
      background: var(--color-primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.5rem;
      font-weight: bold;
    }
    .team-name {
      font-size: 1.3rem;
      font-weight: 600;
    }
    .team-stats {
      display: flex;
      gap: 2rem;
      margin-bottom: 1.5rem;
      color: var(--color-muted);
      font-size: 1rem;
    }
    .roster {
      margin-bottom: 2rem;
    }
    .roster-title {
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .roster-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .roster-player {
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: 6px;
      padding: 0.5rem 1rem;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.15s;
    }
    .roster-player:hover, .roster-player:focus {
      background: #e7f1ff;
      outline: none;
    }
    .recent-results {
      margin-bottom: 2rem;
    }
    .results-title {
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .results-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .result-item {
      color: var(--color-text);
      font-size: 1rem;
    }
    /* Player details modal */
    .player-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(33,37,41,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .player-modal-content {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 16px rgba(33,37,41,0.12);
      padding: 2rem 1.5rem;
      max-width: 400px;
      width: 100%;
      position: relative;
    }
    .player-modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      font-size: 1.25rem;
      color: var(--color-muted);
      cursor: pointer;
    }
    .player-name {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .player-bio {
      color: var(--color-muted);
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    .player-stats {
      font-size: 1rem;
      color: var(--color-text);
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <header>Football Live &ndash; Team Info</header>
  <main class="container" aria-label="Team and player information">
    <!-- Team Details State -->
    <section class="team-header">
      <div class="team-logo" aria-label="Team logo">MU</div>
      <div class="team-name">Manchester United</div>
    </section>
    <section class="team-stats">
      <div>League: Premier League</div>
      <div>Position: 2nd</div>
      <div>Points: 68</div>
    </section>
    <section class="roster">
      <div class="roster-title">Team Roster</div>
      <ul class="roster-list">
        <li class="roster-player" tabindex="0" aria-label="View player Marcus Rashford">Marcus Rashford</li>
        <li class="roster-player" tabindex="0" aria-label="View player Bruno Fernandes">Bruno Fernandes</li>
        <li class="roster-player" tabindex="0" aria-label="View player David De Gea">David De Gea</li>
        <li class="roster-player" tabindex="0" aria-label="View player Casemiro">Casemiro</li>
      </ul>
    </section>
    <section class="recent-results">
      <div class="results-title">Recent Results</div>
      <ul class="results-list">
        <li class="result-item">W 2-1 vs Real Madrid</li>
        <li class="result-item">D 1-1 vs Liverpool</li>
        <li class="result-item">L 0-2 vs Chelsea</li>
      </ul>
    </section>
    <!-- Player Details Modal (Populated State) -->
    <!--
    <div class="player-modal" role="dialog" aria-modal="true" aria-label="Player details">
      <div class="player-modal-content">
        <button class="player-modal-close" aria-label="Close player details">&times;</button>
        <div class="player-name">Marcus Rashford</div>
        <div class="player-bio">Forward, Age: 25, England</div>
        <div class="player-stats">Goals: 18 | Assists: 7 | Appearances: 32</div>
        <div class="player-bio">Marcus Rashford is known for his pace and finishing. He has been a key player for Manchester United and the England national team.</div>
      </div>
    </div>
    -->
  </main>
</body>
</html>
