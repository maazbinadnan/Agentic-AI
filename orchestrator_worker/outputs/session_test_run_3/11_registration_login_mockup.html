<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration & Login (US-006)</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
      --color-border: #dee2e6;
      --color-error: #dc3545;
      --color-success: #198754;
      --color-muted: #6c757d;
    }
    body {
      margin: 0;
      background: var(--color-bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .auth-container {
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(33,37,41,0.04);
      padding: 2.5rem 2rem 2rem 2rem;
      max-width: 350px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .auth-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      text-align: center;
    }
    .auth-tabs {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 1rem;
    }
    .auth-tab {
      background: none;
      border: none;
      font-size: 1rem;
      font-weight: 500;
      color: var(--color-muted);
      cursor: pointer;
      padding: 0.25rem 0.5rem;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border 0.15s;
    }
    .auth-tab.active {
      color: var(--color-primary);
      border-bottom: 2px solid var(--color-primary);
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    label {
      font-size: 1rem;
      font-weight: 500;
      margin-bottom: 0.25rem;
    }
    input[type="text"],
    input[type="email"],
    input[type="password"] {
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      font-size: 1rem;
      background: var(--color-bg);
      color: var(--color-text);
    }
    .input-group {
      position: relative;
      display: flex;
      align-items: center;
    }
    .toggle-password {
      position: absolute;
      right: 0.75rem;
      background: none;
      border: none;
      color: var(--color-muted);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0;
    }
    .form-error {
      color: var(--color-error);
      font-size: 0.98rem;
      margin-top: -0.5rem;
      margin-bottom: 0.5rem;
    }
    .form-success {
      color: var(--color-success);
      font-size: 1rem;
      text-align: center;
      margin-bottom: 0.5rem;
    }
    button[type="submit"] {
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 0.75rem 0;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button[type="submit"]:hover, button[type="submit"]:focus {
      background: #0b5ed7;
      outline: none;
    }
  </style>
</head>
<body>
  <section class="auth-container" aria-label="Registration and login">
    <div class="auth-title">Welcome to Football Live</div>
    <nav class="auth-tabs" aria-label="Authentication tabs">
      <button class="auth-tab active" aria-selected="true">Register</button>
      <button class="auth-tab" aria-selected="false">Login</button>
    </nav>
    <!-- Registration Form (Default State) -->
    <form aria-label="Registration form">
      <label for="reg-email">Email</label>
      <input type="email" id="reg-email" name="reg-email" autocomplete="email" required aria-required="true" placeholder="you@email.com">
      <label for="reg-password">Password</label>
      <div class="input-group">
        <input type="password" id="reg-password" name="reg-password" autocomplete="new-password" required aria-required="true" placeholder="Create password">
        <button type="button" class="toggle-password" aria-label="Show password">👁️</button>
      </div>
      <button type="submit">Register</button>
      <!-- Error State -->
      <!-- <div class="form-error">Email already in use or invalid password.</div> -->
      <!-- Success State -->
      <!-- <div class="form-success">Registration successful! Redirecting...</div> -->
    </form>
    <!-- Login Form (Hidden by default, shown when Login tab active) -->
    <!--
    <form aria-label="Login form">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" name="login-email" autocomplete="email" required aria-required="true" placeholder="you@email.com">
      <label for="login-password">Password</label>
      <div class="input-group">
        <input type="password" id="login-password" name="login-password" autocomplete="current-password" required aria-required="true" placeholder="Your password">
        <button type="button" class="toggle-password" aria-label="Show password">👁️</button>
      </div>
      <button type="submit">Login</button>
      <!-- Error State -->
      <!-- <div class="form-error">Incorrect email or password.</div> -->
      <!-- Success State -->
      <!-- <div class="form-success">Login successful! Redirecting...</div> -->
    </form>
    -->
  </section>
</body>
</html>
