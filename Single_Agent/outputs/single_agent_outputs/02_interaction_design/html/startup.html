<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>App Startup</title>
  <style>
    :root {
      --primary: #0d6efd;
      --gray-light: #f8f9fa;
      --gray-dark: #212529;
    }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--primary); color: #fff; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .logo { font-size: 2rem; font-weight: bold; margin-bottom: 2rem; }
    .loading { border: 4px solid #fff; border-top: 4px solid var(--gray-light); border-radius: 50%; width: 48px; height: 48px; animation: spin 1s linear infinite; margin-bottom: 1rem; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .timer { font-size: 1rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <main>
    <div class="logo">Football Fan App</div>
    <div class="loading"></div>
    <div class="timer">Loaded in <strong>1.8s</strong></div>
  </main>
</body>
</html>
