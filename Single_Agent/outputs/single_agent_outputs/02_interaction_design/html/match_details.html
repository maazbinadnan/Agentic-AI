<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Match Details & Live Stream</title>
  <style>
    :root {
      --primary: #0d6efd;
      --gray-light: #f8f9fa;
      --gray-dark: #212529;
      --border: #dee2e6;
      --error: #dc3545;
    }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--gray-light); color: var(--gray-dark); margin: 0; }
    header { padding: 1rem; background: var(--primary); color: #fff; }
    main { padding: 2rem; max-width: 600px; margin: auto; }
    .match-card { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; margin-bottom: 2rem; }
    .teams { display: flex; justify-content: space-between; font-size: 1.2rem; margin-bottom: 1rem; }
    .score { text-align: center; font-size: 2rem; margin-bottom: 1rem; }
    .stream-link { background: var(--primary); color: #fff; padding: 0.75rem 1.5rem; border-radius: 6px; text-decoration: none; display: inline-block; margin-top: 1rem; }
    .rights-msg { color: var(--error); margin-top: 1rem; }
  </style>
</head>
<body>
  <header>
    <h1>Match Details</h1>
  </header>
  <main>
    <div class="match-card">
      <div class="teams">
        <span>Barcelona</span>
        <span>vs</span>
        <span>Real Madrid</span>
      </div>
      <div class="score">2 - 1</div>
      <div class="stream-link">Watch Live Stream</div>
      <div class="rights-msg" style="display:none;">Live stream not available in your country due to broadcast rights.</div>
    </div>
  </main>
</body>
</html>
