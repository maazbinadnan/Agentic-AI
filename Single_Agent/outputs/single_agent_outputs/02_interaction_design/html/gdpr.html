<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GDPR Compliance</title>
  <style>
    :root {
      --primary: #0d6efd;
      --gray-light: #f8f9fa;
      --gray-dark: #212529;
      --border: #dee2e6;
      --error: #dc3545;
    }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--gray-light); color: var(--gray-dark); margin: 0; }
    header { padding: 1rem; background: var(--primary); color: #fff; }
    main { padding: 2rem; max-width: 600px; margin: auto; }
    .gdpr-banner { background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 1rem; margin-bottom: 2rem; }
    .consent { display: flex; align-items: center; gap: 1rem; }
    .error { color: var(--error); margin-top: 1rem; }
  </style>
</head>
<body>
  <header>
    <h1>GDPR Compliance</h1>
  </header>
  <main>
    <div class="gdpr-banner">
      <p>Your personal data is processed securely and in compliance with GDPR. Please review our privacy policy.</p>
    </div>
    <div class="consent">
      <input type="checkbox" id="gdpr-consent">
      <label for="gdpr-consent">I consent to GDPR-compliant data processing</label>
    </div>
    <div class="error" style="display:none;">Consent required to proceed.</div>
  </main>
</body>
</html>
