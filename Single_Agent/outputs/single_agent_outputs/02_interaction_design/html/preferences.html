<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Preferences - Favorite Teams & Channels</title>
  <style>
    :root {
      --primary: #0d6efd;
      --gray-light: #f8f9fa;
      --gray-dark: #212529;
      --border: #dee2e6;
      --error: #dc3545;
    }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--gray-light); color: var(--gray-dark); margin: 0; }
    header { padding: 1rem; background: var(--primary); color: #fff; }
    main { padding: 2rem; max-width: 600px; margin: auto; }
    h2 { margin-top: 0; }
    .teams-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2rem; }
    .team { background: #fff; border: 1px solid var(--border); padding: 1rem; border-radius: 8px; text-align: center; cursor: pointer; }
    .team.selected { border-color: var(--primary); background: #e7f1ff; }
    .channels-list { margin-bottom: 2rem; }
    .channel { display: flex; align-items: center; margin-bottom: 0.5rem; }
    .channel input { margin-right: 0.5rem; }
    .save-btn { background: var(--primary); color: #fff; border: none; padding: 0.75rem 2rem; border-radius: 6px; font-size: 1rem; cursor: pointer; }
    .error { color: var(--error); margin-top: 1rem; }
  </style>
</head>
<body>
  <header>
    <h1>Preferences</h1>
  </header>
  <main>
    <h2>Select Your Favorite Teams</h2>
    <div class="teams-grid">
      <div class="team selected">FC Barcelona</div>
      <div class="team">Manchester United</div>
      <div class="team">Real Madrid</div>
      <div class="team">Liverpool</div>
      <div class="team">Juventus</div>
      <div class="team">Bayern Munich</div>
    </div>
    <h2>Select Sports Channels</h2>
    <div class="channels-list">
      <div class="channel"><input type="checkbox" checked> ESPN</div>
      <div class="channel"><input type="checkbox"> Sky Sports</div>
      <div class="channel"><input type="checkbox"> DAZN</div>
    </div>
    <button class="save-btn">Save Preferences</button>
    <div class="error" style="display:none;">Please select at least one team and channel.</div>
  </main>
</body>
</html>
