<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Team & Player Profile</title>
  <style>
    :root {
      --primary: #0d6efd;
      --gray-light: #f8f9fa;
      --gray-dark: #212529;
      --border: #dee2e6;
      --error: #dc3545;
    }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--gray-light); color: var(--gray-dark); margin: 0; }
    header { padding: 1rem; background: var(--primary); color: #fff; }
    main { padding: 2rem; max-width: 700px; margin: auto; }
    .profile-section { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; margin-bottom: 2rem; }
    .profile-title { font-size: 1.3rem; margin-bottom: 1rem; }
    .stats-table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
    .stats-table th, .stats-table td { border: 1px solid var(--border); padding: 0.5rem; text-align: left; }
    .error { color: var(--error); margin-top: 1rem; }
  </style>
</head>
<body>
  <header>
    <h1>Team & Player Profile</h1>
  </header>
  <main>
    <section class="profile-section">
      <div class="profile-title">Team: Barcelona</div>
      <table class="stats-table">
        <tr><th>Wins</th><td>18</td></tr>
        <tr><th>Losses</th><td>3</td></tr>
        <tr><th>Draws</th><td>5</td></tr>
      </table>
    </section>
    <section class="profile-section">
      <div class="profile-title">Player: Lionel Messi</div>
      <table class="stats-table">
        <tr><th>Goals</th><td>25</td></tr>
        <tr><th>Assists</th><td>10</td></tr>
        <tr><th>Appearances</th><td>30</td></tr>
      </table>
    </section>
    <div class="error" style="display:none;">Player data not available.</div>
  </main>
</body>
</html>
