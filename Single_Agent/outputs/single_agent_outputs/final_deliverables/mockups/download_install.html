<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Download & Install App</title>
  <style>
    :root {
      --primary: #0d6efd;
      --gray-light: #f8f9fa;
      --gray-dark: #212529;
      --border: #dee2e6;
    }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--gray-light); color: var(--gray-dark); margin: 0; }
    header { padding: 1rem; background: var(--primary); color: #fff; }
    main { padding: 2rem; max-width: 500px; margin: auto; }
    .platforms { display: flex; gap: 2rem; margin-bottom: 2rem; }
    .store-btn { background: var(--primary); color: #fff; border: none; padding: 1rem 2rem; border-radius: 8px; font-size: 1.1rem; cursor: pointer; flex: 1; }
    .info { background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 1rem; margin-bottom: 1rem; }
    .confirmation { color: var(--primary); font-weight: bold; margin-top: 1rem; }
  </style>
</head>
<body>
  <header>
    <h1>Download & Install</h1>
  </header>
  <main>
    <div class="info">
      <p>Available for Android and iOS devices.</p>
    </div>
    <div class="platforms">
      <button class="store-btn">Google Play</button>
      <button class="store-btn">App Store</button>
    </div>
    <div class="confirmation">App installed successfully!</div>
  </main>
</body>
</html>
