<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notifications Settings</title>
  <style>
    :root {
      --primary: #0d6efd;
      --gray-light: #f8f9fa;
      --gray-dark: #212529;
      --border: #dee2e6;
      --error: #dc3545;
    }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--gray-light); color: var(--gray-dark); margin: 0; }
    header { padding: 1rem; background: var(--primary); color: #fff; }
    main { padding: 2rem; max-width: 500px; margin: auto; }
    .toggle { display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem; }
    .toggle input[type="checkbox"] { width: 24px; height: 24px; }
    .preview { background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 1rem; margin-bottom: 1rem; }
    .error { color: var(--error); margin-top: 1rem; }
  </style>
</head>
<body>
  <header>
    <h1>Notifications</h1>
  </header>
  <main>
    <div class="toggle">
      <input type="checkbox" checked id="notif-toggle">
      <label for="notif-toggle">Enable real-time notifications</label>
    </div>
    <div class="preview">
      <strong>Sample Notification:</strong>
      <p>Barcelona scored! Tap to view match details.</p>
    </div>
    <div class="error" style="display:none;">Notification permission denied. Please enable in device settings.</div>
  </main>
</body>
</html>
