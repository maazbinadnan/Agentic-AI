<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Share News Article</title>
  <style>
    :root {
      --primary: #0d6efd;
      --gray-light: #f8f9fa;
      --gray-dark: #212529;
      --border: #dee2e6;
      --error: #dc3545;
    }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--gray-light); color: var(--gray-dark); margin: 0; }
    header { padding: 1rem; background: var(--primary); color: #fff; }
    main { padding: 2rem; max-width: 600px; margin: auto; }
    .news-article { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; margin-bottom: 2rem; }
    .share-btn { background: var(--primary); color: #fff; border: none; padding: 0.75rem 2rem; border-radius: 6px; font-size: 1rem; cursor: pointer; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.3); justify-content: center; align-items: center; }
    .modal-content { background: #fff; border-radius: 8px; padding: 2rem; min-width: 300px; }
    .modal-content button { margin: 0.5rem 0; width: 100%; }
    .error { color: var(--error); margin-top: 1rem; }
  </style>
</head>
<body>
  <header>
    <h1>Share News</h1>
  </header>
  <main>
    <article class="news-article">
      <h2>Barcelona Wins El Clasico</h2>
      <p>Barcelona secured a 2-1 victory over Real Madrid in a thrilling match.</p>
      <button class="share-btn">Share</button>
    </article>
    <div class="modal" id="share-modal">
      <div class="modal-content">
        <h3>Select Platform</h3>
        <button>Facebook</button>
        <button>Twitter</button>
        <button>WhatsApp</button>
        <button>Cancel</button>
      </div>
    </div>
    <div class="error" style="display:none;">Failed to share. Please try again.</div>
  </main>
</body>
</html>
