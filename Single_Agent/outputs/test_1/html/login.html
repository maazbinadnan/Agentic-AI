<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveFootball App - Login</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,700">
  <style>
    body { font-family: Roboto, Arial, sans-serif; background: #f5f5f5; margin: 0; }
    .container { max-width: 400px; margin: 60px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 32px; }
    h2 { text-align: center; color: #2c3e50; }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; color: #34495e; }
    input[type="text"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
    .btn { width: 100%; padding: 12px; background: #27ae60; color: #fff; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
    .btn:hover { background: #219150; }
    .oauth { display: flex; justify-content: space-between; margin-top: 16px; }
    .oauth button { flex: 1; margin: 0 4px; background: #2980b9; color: #fff; border: none; border-radius: 4px; padding: 10px; cursor: pointer; }
    .oauth button.google { background: #db4437; }
    .oauth button.facebook { background: #4267B2; }
    .remember { display: flex; align-items: center; margin-bottom: 18px; }
    .remember input { margin-right: 8px; }
    .register-link { text-align: center; margin-top: 18px; color: #2980b9; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Login to LiveFootball</h2>
    <form>
      <div class="form-group">
        <label for="username">Email or Username</label>
        <input type="text" id="username" name="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <div class="remember">
        <input type="checkbox" id="remember" name="remember">
        <label for="remember">Remember me</label>
      </div>
      <button class="btn" type="submit">Login</button>
      <div class="oauth">
        <button class="google" type="button">Google</button>
        <button class="facebook" type="button">Facebook</button>
      </div>
    </form>
    <div class="register-link">Don't have an account? Register</div>
  </div>
</body>
</html>
