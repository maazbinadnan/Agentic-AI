<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveFootball App - News Details</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,700">
  <style>
    body { font-family: Roboto, Arial, sans-serif; background: #f5f5f5; margin: 0; }
    .container { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 32px; }
    h2 { color: #2c3e50; margin-bottom: 18px; }
    .news-meta { color: #888; font-size: 0.95em; margin-bottom: 12px; }
    .news-content { margin-bottom: 24px; }
    .share-btn { padding: 10px 18px; background: #2980b9; color: #fff; border: none; border-radius: 4px; font-size: 15px; cursor: pointer; }
    .share-btn:hover { background: #1c5a8a; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Manchester United signs new striker</h2>
    <div class="news-meta">10 mins ago | Premier League</div>
    <div class="news-content">
      Manchester United has completed the signing of a new striker, strengthening their squad ahead of the upcoming season. The player is expected to make an immediate impact.
    </div>
    <button class="share-btn">Share on Social Media</button>
  </div>
</body>
</html>
