<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveFootball App - Team Details</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,700">
  <style>
    body { font-family: Roboto, Arial, sans-serif; background: #f5f5f5; margin: 0; }
    .container { max-width: 700px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 32px; }
    h2 { color: #2c3e50; margin-bottom: 18px; }
    .team-info { display: flex; align-items: center; margin-bottom: 24px; }
    .team-logo { width: 80px; height: 80px; margin-right: 24px; background: #eee; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2em; color: #27ae60; }
    .team-details { }
    .players-list { margin-top: 24px; }
    .player { padding: 12px 0; border-bottom: 1px solid #eee; }
    .player:last-child { border-bottom: none; }
    .player-name { font-weight: 500; color: #34495e; }
    .player-info { color: #888; font-size: 0.95em; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Team Details: Manchester United</h2>
    <div class="team-info">
      <div class="team-logo">MU</div>
      <div class="team-details">
        <strong>League:</strong> Premier League<br>
        <strong>Founded:</strong> 1878<br>
        <strong>Stadium:</strong> Old Trafford<br>
        <strong>Manager:</strong> Erik ten Hag
      </div>
    </div>
    <div class="players-list">
      <h3>Players</h3>
      <div class="player">
        <span class="player-name">Bruno Fernandes</span> <span class="player-info">- Midfielder</span>
      </div>
      <div class="player">
        <span class="player-name">Marcus Rashford</span> <span class="player-info">- Forward</span>
      </div>
      <div class="player">
        <span class="player-name">Raphaël Varane</span> <span class="player-info">- Defender</span>
      </div>
      <div class="player">
        <span class="player-name">David de Gea</span> <span class="player-info">- Goalkeeper</span>
      </div>
    </div>
  </div>
</body>
</html>
