<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveFootball App - Settings</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,700">
  <style>
    body { font-family: Roboto, Arial, sans-serif; background: #f5f5f5; margin: 0; }
    .container { max-width: 500px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 32px; }
    h2 { color: #2c3e50; margin-bottom: 18px; }
    .section { margin-bottom: 24px; }
    label { display: block; margin-bottom: 8px; color: #34495e; }
    select, input[type="checkbox"] { margin-bottom: 12px; }
    .btn { padding: 10px 18px; background: #27ae60; color: #fff; border: none; border-radius: 4px; font-size: 15px; cursor: pointer; }
    .btn:hover { background: #219150; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Settings & Personalization</h2>
    <div class="section">
      <label for="favorite-teams">Select Favorite Teams:</label>
      <select id="favorite-teams" multiple>
        <option>Manchester United</option>
        <option>Real Madrid</option>
        <option>Bayern Munich</option>
        <option>Juventus</option>
      </select>
    </div>
    <div class="section">
      <label for="sports-channels">Select Preferred Sports Channels:</label>
      <select id="sports-channels" multiple>
        <option>DAZN</option>
        <option>Sky Sport</option>
        <option>BT Sport</option>
      </select>
    </div>
    <div class="section">
      <label>Notifications:</label>
      <input type="checkbox" id="news-notifications"> News Notifications<br>
      <input type="checkbox" id="score-notifications"> Score Notifications<br>
      <input type="checkbox" id="event-notifications"> Event Notifications<br>
    </div>
    <button class="btn">Save Settings</button>
  </div>
</body>
</html>
