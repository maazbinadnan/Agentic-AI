<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Results Ticker</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
      --color-border: #dee2e6;
      --color-error: #dc3545;
      --color-offline: #ffc107;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    main {
      width: 100%;
      max-width: 600px;
      margin-top: 32px;
    }
    h2 {
      color: var(--color-primary);
      margin-bottom: 16px;
      font-size: 1.3rem;
    }
    .offline-banner {
      background: var(--color-offline);
      color: #212529;
      padding: 8px 16px;
      border-radius: 4px;
      margin-bottom: 16px;
      font-size: 1rem;
      text-align: center;
    }
    .live-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .match-card {
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .match-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--color-primary);
    }
    .match-status {
      font-size: 0.95rem;
      color: var(--color-text);
    }
    .match-score {
      font-size: 1.2rem;
      color: var(--color-text);
      font-weight: bold;
    }
    .empty-state {
      text-align: center;
      color: var(--color-text);
      font-size: 1rem;
      margin-top: 32px;
    }
    .error {
      color: var(--color-error);
      font-size: 1rem;
      margin-top: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <h2>Live Results for Your Teams</h2>
    <div class="offline-banner" style="display:none;">You are offline. Showing previously loaded results.</div>
    <div class="live-list">
      <article class="match-card">
        <div class="match-title">Manchester United vs Liverpool</div>
        <div class="match-status">In Progress - 65'</div>
        <div class="match-score">2 - 1</div>
      </article>
      <article class="match-card">
        <div class="match-title">Real Madrid vs FC Barcelona</div>
        <div class="match-status">In Progress - 70'</div>
        <div class="match-score">1 - 1</div>
      </article>
    </div>
    <div class="empty-state" style="display:none;">No live matches for your selected teams.</div>
    <div class="error" style="display:none;">Failed to load live results. Please try again.</div>
  </main>
</body>
</html>
