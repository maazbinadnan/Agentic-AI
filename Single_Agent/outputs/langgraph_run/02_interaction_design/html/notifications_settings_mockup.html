<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notification Settings</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
      --color-border: #dee2e6;
      --color-error: #dc3545;
      --color-success: #198754;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }
    main {
      margin-top: 40px;
      width: 100%;
      max-width: 420px;
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 32px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    h2 {
      color: var(--color-primary);
      margin-bottom: 24px;
      font-size: 1.3rem;
    }
    .section {
      margin-bottom: 24px;
    }
    .toggle {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .toggle input[type="checkbox"] {
      width: 20px;
      height: 20px;
    }
    .btn {
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 10px 24px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 16px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #0b5ed7;
    }
    .success {
      color: var(--color-success);
      font-size: 0.95rem;
      margin-top: 8px;
    }
    .error {
      color: var(--color-error);
      font-size: 0.95rem;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <main>
    <h2>Notification Settings</h2>
    <section class="section" aria-label="Notification Types">
      <div class="toggle">
        <input type="checkbox" id="news-notif" checked>
        <label for="news-notif">News Notifications</label>
      </div>
      <div class="toggle">
        <input type="checkbox" id="results-notif" checked>
        <label for="results-notif">Results Notifications</label>
      </div>
    </section>
    <button class="btn" type="button">Save Settings</button>
    <div class="success" style="display:none;">Notification settings saved!</div>
    <div class="error" style="display:none;">Failed to save settings. Please try again.</div>
  </main>
</body>
</html>
