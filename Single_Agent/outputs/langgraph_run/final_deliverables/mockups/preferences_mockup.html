<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Preferences - Favorite Teams & Channels</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
      --color-border: #dee2e6;
      --color-error: #dc3545;
      --color-success: #198754;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }
    main {
      margin-top: 40px;
      width: 100%;
      max-width: 420px;
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 32px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    h2 {
      color: var(--color-primary);
      margin-bottom: 24px;
      font-size: 1.3rem;
    }
    .section {
      margin-bottom: 24px;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .chip {
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: 16px;
      padding: 6px 16px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, border 0.2s;
    }
    .chip.selected {
      background: var(--color-primary);
      color: #fff;
      border-color: var(--color-primary);
    }
    .btn {
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 10px 24px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 16px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #0b5ed7;
    }
    .success {
      color: var(--color-success);
      font-size: 0.95rem;
      margin-top: 8px;
    }
    .error {
      color: var(--color-error);
      font-size: 0.95rem;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <main>
    <h2>Set Your Preferences</h2>
    <section class="section" aria-label="Favorite Teams">
      <label for="teams">Select Favorite Teams:</label>
      <div class="chips" id="teams">
        <div class="chip selected">Manchester United</div>
        <div class="chip">Real Madrid</div>
        <div class="chip">FC Barcelona</div>
        <div class="chip">Liverpool</div>
        <div class="chip">Juventus</div>
      </div>
    </section>
    <section class="section" aria-label="Sports Channels">
      <label for="channels">Select Sports Channels:</label>
      <div class="chips" id="channels">
        <div class="chip selected">ESPN</div>
        <div class="chip">Sky Sports</div>
        <div class="chip">beIN Sports</div>
        <div class="chip">Fox Sports</div>
      </div>
    </section>
    <button class="btn" type="button">Save Preferences</button>
    <div class="success" style="display:none;">Preferences saved successfully!</div>
    <div class="error" style="display:none;">Failed to save preferences. Please try again.</div>
  </main>
</body>
</html>
