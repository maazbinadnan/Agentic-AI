<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>App Startup & Login</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
      --color-border: #dee2e6;
      --color-error: #dc3545;
      --color-success: #198754;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 32px;
    }
    .logo {
      width: 64px;
      height: 64px;
      background: var(--color-primary);
      border-radius: 50%;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 2rem;
      font-weight: bold;
    }
    .loading {
      margin-top: 8px;
      color: var(--color-primary);
      font-size: 1rem;
    }
    .auth-container {
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 24px;
      width: 320px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .auth-container h2 {
      margin: 0 0 8px 0;
      font-size: 1.25rem;
      color: var(--color-primary);
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    label {
      font-size: 0.95rem;
      color: var(--color-text);
    }
    input[type="text"], input[type="password"] {
      padding: 8px;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      font-size: 1rem;
    }
    .btn {
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 10px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #0b5ed7;
    }
    .error {
      color: var(--color-error);
      font-size: 0.95rem;
      margin-top: 4px;
    }
    .success {
      color: var(--color-success);
      font-size: 0.95rem;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="logo" aria-label="App Logo">⚽</div>
    <div class="loading" id="loading-indicator">Loading...</div>
  </div>
  <main>
    <section class="auth-container" aria-label="Authentication">
      <h2>Welcome</h2>
      <form id="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password">
        </div>
        <button class="btn" type="submit">Log In</button>
        <div class="error" id="login-error" style="display:none;">Invalid credentials. Please try again.</div>
      </form>
      <form id="register-form">
        <div class="form-group">
          <label for="new-username">New Username</label>
          <input type="text" id="new-username" name="new-username" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="new-password">New Password</label>
          <input type="password" id="new-password" name="new-password" autocomplete="new-password">
        </div>
        <button class="btn" type="submit">Register</button>
        <div class="success" id="register-success" style="display:none;">Registration successful! Please log in.</div>
        <div class="error" id="register-error" style="display:none;">Registration failed. Please check your input.</div>
      </form>
    </section>
  </main>
</body>
</html>
