<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Match Details & Live Stream</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
      --color-border: #dee2e6;
      --color-error: #dc3545;
      --color-success: #198754;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }
    main {
      margin-top: 40px;
      width: 100%;
      max-width: 520px;
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 32px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    h2 {
      color: var(--color-primary);
      margin-bottom: 24px;
      font-size: 1.3rem;
    }
    .match-info {
      margin-bottom: 24px;
    }
    .match-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--color-primary);
    }
    .match-meta {
      font-size: 0.95rem;
      color: var(--color-text);
      margin-bottom: 8px;
    }
    .match-stats {
      font-size: 1rem;
      color: var(--color-text);
      margin-bottom: 16px;
    }
    .stream-link {
      background: var(--color-success);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 10px 24px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
      display: inline-block;
    }
    .stream-link:hover {
      background: #157347;
    }
    .stream-unavailable {
      color: var(--color-error);
      font-size: 1rem;
      margin-top: 8px;
    }
    .error {
      color: var(--color-error);
      font-size: 0.95rem;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <main>
    <h2>Match Details</h2>
    <section class="match-info" aria-label="Match Information">
      <div class="match-title">Manchester United vs Liverpool</div>
      <div class="match-meta">Premier League | 2024-06-10 | 18:00</div>
      <div class="match-stats">Score: 2 - 1 | Possession: 55% - 45% | Shots: 10 - 8</div>
      <button class="stream-link" type="button">Watch Live Stream</button>
      <div class="stream-unavailable" style="display:none;">Live stream unavailable in your country due to rights restrictions.</div>
      <div class="error" style="display:none;">Failed to load live stream link. Please try again.</div>
    </section>
  </main>
</body>
</html>
