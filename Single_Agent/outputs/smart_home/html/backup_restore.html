<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backup & Restore</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6fa; margin: 0; }
    .wrap { padding: 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }
    .phone { background: #fff; border-radius: 16px; box-shadow: 0 2px 8px #0001; overflow: hidden; }
    .top { background: #e3e8f0; padding: 12px 16px; border-bottom: 1px solid #dde; display: flex; justify-content: space-between; align-items: center; }
    .meta { font-size: 0.9em; color: #666; }
    .screen { padding: 24px; }
    button { background: #2a6eea; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; font-size: 1em; cursor: pointer; margin-right: 12px; }
    .success { color: #080; margin-top: 8px; }
    .error { color: #c00; margin-top: 8px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="grid">
    <!-- Populated State -->
    <div class="phone">
      <div class="top"><strong>Backup & Restore</strong><span class="meta">Populated</span></div>
      <div class="screen">
        <button>Backup Now</button>
        <button>Restore Data</button>
        <div class="success">Last backup completed successfully at 2024-06-01 14:22.</div>
      </div>
    </div>
    <!-- Empty State -->
    <div class="phone">
      <div class="top"><strong>Backup & Restore</strong><span class="meta">Empty State</span></div>
      <div class="screen">
        <button>Backup Now</button>
        <button>Restore Data</button>
        <div>No backups found.</div>
      </div>
    </div>
    <!-- Error State -->
    <div class="phone">
      <div class="top"><strong>Backup & Restore</strong><span class="meta">Error State</span></div>
      <div class="screen">
        <button>Backup Now</button>
        <button>Restore Data</button>
        <div class="error">Backup failed. Please try again.</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
