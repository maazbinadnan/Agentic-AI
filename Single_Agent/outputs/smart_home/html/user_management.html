<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6fa; margin: 0; }
    .wrap { padding: 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }
    .phone { background: #fff; border-radius: 16px; box-shadow: 0 2px 8px #0001; overflow: hidden; }
    .top { background: #e3e8f0; padding: 12px 16px; border-bottom: 1px solid #dde; display: flex; justify-content: space-between; align-items: center; }
    .meta { font-size: 0.9em; color: #666; }
    .screen { padding: 24px; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 18px; }
    th, td { padding: 10px; border-bottom: 1px solid #dde; text-align: left; }
    th { background: #f4f6fa; }
    .actions button { margin-right: 8px; }
    .error { color: #c00; margin-top: 8px; }
    .success { color: #080; margin-top: 8px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="grid">
    <!-- Populated State -->
    <div class="phone">
      <div class="top"><strong>User Management</strong><span class="meta">Populated</span></div>
      <div class="screen">
        <table>
          <tr><th>Username</th><th>Role</th><th>Actions</th></tr>
          <tr><td>alice</td><td>General User</td><td class="actions"><button>Edit</button><button>Remove</button></td></tr>
          <tr><td>bob</td><td>Master User</td><td class="actions"><button>Edit</button><button>Remove</button></td></tr>
          <tr><td>carol</td><td>Technician</td><td class="actions"><button>Edit</button><button>Remove</button></td></tr>
        </table>
        <button>Add User</button>
      </div>
    </div>
    <!-- Empty State -->
    <div class="phone">
      <div class="top"><strong>User Management</strong><span class="meta">Empty State</span></div>
      <div class="screen">
        <div>No users found. <button>Add User</button></div>
      </div>
    </div>
    <!-- Error State -->
    <div class="phone">
      <div class="top"><strong>User Management</strong><span class="meta">Error State</span></div>
      <div class="screen">
        <table>
          <tr><th>Username</th><th>Role</th><th>Actions</th></tr>
          <tr><td>alice</td><td>General User</td><td class="actions"><button>Edit</button><button>Remove</button></td></tr>
        </table>
        <div class="error">Failed to load user data.</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
