<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DigitalHome Login</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6fa; margin: 0; }
    .wrap { padding: 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }
    .phone { background: #fff; border-radius: 16px; box-shadow: 0 2px 8px #0001; overflow: hidden; }
    .top { background: #e3e8f0; padding: 12px 16px; border-bottom: 1px solid #dde; display: flex; justify-content: space-between; align-items: center; }
    .meta { font-size: 0.9em; color: #666; }
    .screen { padding: 24px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; font-weight: 500; }
    input[type="text"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ccd; border-radius: 6px; }
    button { background: #2a6eea; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; font-size: 1em; cursor: pointer; }
    .error { color: #c00; margin-top: 8px; }
    .success { color: #080; margin-top: 8px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="grid">
    <!-- Populated State -->
    <div class="phone">
      <div class="top"><strong>Login</strong><span class="meta">Populated</span></div>
      <div class="screen">
        <form>
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter username">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password">
          </div>
          <button type="submit">Login</button>
        </form>
      </div>
    </div>
    <!-- Error State -->
    <div class="phone">
      <div class="top"><strong>Login</strong><span class="meta">Error State</span></div>
      <div class="screen">
        <form>
          <div class="form-group">
            <label for="username2">Username</label>
            <input type="text" id="username2" value="wronguser">
          </div>
          <div class="form-group">
            <label for="password2">Password</label>
            <input type="password" id="password2" value="wrongpass">
          </div>
          <button type="submit">Login</button>
          <div class="error">Invalid username or password.</div>
        </form>
      </div>
    </div>
    <!-- Empty State -->
    <div class="phone">
      <div class="top"><strong>Login</strong><span class="meta">Empty State</span></div>
      <div class="screen">
        <form>
          <div class="form-group">
            <label for="username3">Username</label>
            <input type="text" id="username3" placeholder="Enter username">
          </div>
          <div class="form-group">
            <label for="password3">Password</label>
            <input type="password" id="password3" placeholder="Enter password">
          </div>
          <button type="submit">Login</button>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>
