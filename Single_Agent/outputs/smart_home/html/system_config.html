<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Configuration</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6fa; margin: 0; }
    .wrap { padding: 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }
    .phone { background: #fff; border-radius: 16px; box-shadow: 0 2px 8px #0001; overflow: hidden; }
    .top { background: #e3e8f0; padding: 12px 16px; border-bottom: 1px solid #dde; display: flex; justify-content: space-between; align-items: center; }
    .meta { font-size: 0.9em; color: #666; }
    .screen { padding: 24px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; font-weight: 500; }
    input[type="text"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccd; border-radius: 6px; }
    button { background: #2a6eea; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; font-size: 1em; cursor: pointer; }
    .error { color: #c00; margin-top: 8px; }
    .success { color: #080; margin-top: 8px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="grid">
    <!-- Populated State -->
    <div class="phone">
      <div class="top"><strong>System Configuration</strong><span class="meta">Populated</span></div>
      <div class="screen">
        <form>
          <div class="form-group">
            <label for="sim-temp-range">Thermostat Range (°C)</label>
            <input type="number" id="sim-temp-range" value="14" min="-10" max="40"> to
            <input type="number" id="sim-temp-range-max" value="40" min="-10" max="40">
          </div>
          <div class="form-group">
            <label for="sim-humidity-range">Humidistat Range (%)</label>
            <input type="number" id="sim-humidity-range" value="20" min="0" max="100"> to
            <input type="number" id="sim-humidity-range-max" value="80" min="0" max="100">
          </div>
          <div class="form-group">
            <label for="gateway-range">Gateway Range (ft)</label>
            <input type="number" id="gateway-range" value="1000" min="100" max="2000">
          </div>
          <button type="submit">Save Configuration</button>
        </form>
      </div>
    </div>
    <!-- Empty State -->
    <div class="phone">
      <div class="top"><strong>System Configuration</strong><span class="meta">Empty State</span></div>
      <div class="screen">
        <form>
          <div class="form-group">
            <label for="sim-temp-range2">Thermostat Range (°C)</label>
            <input type="number" id="sim-temp-range2" placeholder="Min"> to
            <input type="number" id="sim-temp-range2-max" placeholder="Max">
          </div>
          <div class="form-group">
            <label for="sim-humidity-range2">Humidistat Range (%)</label>
            <input type="number" id="sim-humidity-range2" placeholder="Min"> to
            <input type="number" id="sim-humidity-range2-max" placeholder="Max">
          </div>
          <div class="form-group">
            <label for="gateway-range2">Gateway Range (ft)</label>
            <input type="number" id="gateway-range2" placeholder="Range">
          </div>
          <button type="submit">Save Configuration</button>
        </form>
      </div>
    </div>
    <!-- Error State -->
    <div class="phone">
      <div class="top"><strong>System Configuration</strong><span class="meta">Error State</span></div>
      <div class="screen">
        <form>
          <div class="form-group">
            <label for="sim-temp-range3">Thermostat Range (°C)</label>
            <input type="number" id="sim-temp-range3" value="14" min="-10" max="40"> to
            <input type="number" id="sim-temp-range3-max" value="40" min="-10" max="40">
          </div>
          <div class="form-group">
            <label for="sim-humidity-range3">Humidistat Range (%)</label>
            <input type="number" id="sim-humidity-range3" value="20" min="0" max="100"> to
            <input type="number" id="sim-humidity-range3-max" value="80" min="0" max="100">
          </div>
          <div class="form-group">
            <label for="gateway-range3">Gateway Range (ft)</label>
            <input type="number" id="gateway-range3" value="1000" min="100" max="2000">
          </div>
          <button type="submit">Save Configuration</button>
          <div class="error">Failed to save configuration. Please try again.</div>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>
