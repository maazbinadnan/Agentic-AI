<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GDPR Compliance</title>
  <style>
    :root {
      --primary: #0d6efd;
      --neutral: #f8f9fa;
      --text: #212529;
      --border: #dee2e6;
      --error: #dc3545;
    }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--neutral); color: var(--text); margin: 0; }
    .modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.2); display: flex; justify-content: center; align-items: center; }
    .modal-content { background: #fff; border-radius: 8px; padding: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 400px; }
    .modal-content h2 { margin-top: 0; }
    .consent-toggle { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
    .error { color: var(--error); margin-top: 1rem; }
    a { color: var(--primary); text-decoration: underline; }
  </style>
</head>
<body>
  <div class="modal">
    <div class="modal-content">
      <h2>GDPR Consent</h2>
      <p>We value your privacy. Please review our <a href="#">Privacy Policy</a> and consent to data processing in accordance with GDPR.</p>
      <div class="consent-toggle">
        <label for="consent">I consent</label>
        <input id="consent" type="checkbox">
      </div>
      <button style="background: var(--primary); color: #fff; border: none; border-radius: 4px; padding: 0.5rem 1rem;">Continue</button>
      <div class="error" style="display:none;">Consent required to proceed.</div>
    </div>
  </div>
</body>
</html>
