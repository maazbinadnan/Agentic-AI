<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>App Startup Performance</title>
  <style>
    :root {
      --primary: #0d6efd;
      --neutral: #f8f9fa;
      --text: #212529;
      --border: #dee2e6;
    }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--neutral); color: var(--text); margin: 0; }
    .splash { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: var(--primary); color: #fff; }
    .logo { font-size: 2rem; font-weight: bold; margin-bottom: 2rem; }
    .loader { border: 4px solid var(--neutral); border-top: 4px solid #fff; border-radius: 50%; width: 48px; height: 48px; animation: spin 1s linear infinite; margin-bottom: 1rem; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .loaded { display: none; }
  </style>
</head>
<body>
  <div class="splash">
    <div class="logo">Football App</div>
    <div class="loader"></div>
    <div>Loading... Ready in 2 seconds</div>
  </div>
  <div class="loaded">
    <!-- Dashboard loaded -->
  </div>
</body>
</html>
