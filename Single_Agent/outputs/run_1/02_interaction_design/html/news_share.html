<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Share News Article</title>
  <style>
    :root {
      --primary: #0d6efd;
      --neutral: #f8f9fa;
      --text: #212529;
      --border: #dee2e6;
      --error: #dc3545;
    }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--neutral); color: var(--text); margin: 0; }
    header { padding: 1rem; background: var(--primary); color: #fff; }
    main { max-width: 500px; margin: 2rem auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); padding: 2rem; }
    .article { border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: 1rem; }
    .share-btn { background: var(--primary); color: #fff; border: none; border-radius: 4px; padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.2); justify-content: center; align-items: center; }
    .modal-content { background: #fff; border-radius: 8px; padding: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .modal-content button { margin: 0.5rem 0; width: 100%; }
    .error { color: var(--error); margin-top: 1rem; }
  </style>
</head>
<body>
  <header>
    <h1>Share News</h1>
  </header>
  <main>
    <div class="article">
      <h2>Barcelona clinches victory in El Clasico</h2>
      <p>Exciting match ends with Barcelona taking the win. Read more...</p>
    </div>
    <button class="share-btn">Share</button>
    <div class="modal" style="display:block;">
      <div class="modal-content">
        <h3>Select Platform</h3>
        <button>Facebook</button>
        <button>Twitter</button>
        <button>WhatsApp</button>
        <button>Cancel</button>
      </div>
    </div>
    <div class="error" style="display:none;">Sharing failed. Please try again.</div>
  </main>
</body>
</html>
