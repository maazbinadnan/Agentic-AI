<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Team & Player Profile</title>
  <style>
    :root {
      --primary: #0d6efd;
      --neutral: #f8f9fa;
      --text: #212529;
      --border: #dee2e6;
      --error: #dc3545;
    }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--neutral); color: var(--text); margin: 0; }
    header { padding: 1rem; background: var(--primary); color: #fff; }
    main { max-width: 600px; margin: 2rem auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); padding: 2rem; }
    .profile-card { border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; margin-bottom: 2rem; background: var(--neutral); }
    .profile-header { display: flex; align-items: center; gap: 1rem; }
    .profile-header img { width: 60px; height: 60px; border-radius: 50%; background: var(--border); }
    .stats { margin-top: 1rem; display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
    .stat { background: #e7f1ff; border-radius: 4px; padding: 0.5rem 1rem; text-align: center; }
    .empty { color: var(--border); text-align: center; margin: 2rem 0; }
  </style>
</head>
<body>
  <header>
    <h1>Team & Player Profile</h1>
  </header>
  <main>
    <section class="profile-card">
      <div class="profile-header">
        <img alt="Team Logo">
        <div>
          <h2>FC Barcelona</h2>
          <p>Founded: 1899 | Stadium: Camp Nou</p>
        </div>
      </div>
      <div class="stats">
        <div class="stat">Wins: 25</div>
        <div class="stat">Losses: 5</div>
        <div class="stat">Draws: 8</div>
        <div class="stat">Top Scorer: Messi</div>
      </div>
    </section>
    <section class="profile-card">
      <div class="profile-header">
        <img alt="Player Photo">
        <div>
          <h2>Lionel Messi</h2>
          <p>Position: Forward | Age: 34</p>
        </div>
      </div>
      <div class="stats">
        <div class="stat">Goals: 30</div>
        <div class="stat">Assists: 12</div>
        <div class="stat">Appearances: 28</div>
        <div class="stat">Yellow Cards: 2</div>
      </div>
    </section>
    <div class="empty" style="display:none;">No data available for this team/player.</div>
  </main>
</body>
</html>
