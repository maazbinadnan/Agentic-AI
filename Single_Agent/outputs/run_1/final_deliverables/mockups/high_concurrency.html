<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>High Concurrency Status</title>
  <style>
    :root {
      --primary: #0d6efd;
      --neutral: #f8f9fa;
      --text: #212529;
      --border: #dee2e6;
      --error: #dc3545;
    }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--neutral); color: var(--text); margin: 0; }
    header { padding: 1rem; background: var(--primary); color: #fff; }
    main { max-width: 500px; margin: 2rem auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); padding: 2rem; }
    .status { background: #e7f1ff; border: 1px solid var(--primary); border-radius: 4px; padding: 1rem; margin-bottom: 1rem; text-align: center; }
    .user-count { font-size: 1.2rem; margin-bottom: 1rem; }
    .error { color: var(--error); background: #fff3f3; border: 1px solid var(--error); border-radius: 4px; padding: 1rem; margin-bottom: 1rem; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>App Performance Status</h1>
  </header>
  <main>
    <div class="status">
      <div class="user-count">Current Users: 98,500</div>
      <div>Performance: Normal</div>
    </div>
    <div class="error" style="display:none;">Performance degraded. Please try again later.</div>
  </main>
</body>
</html>
