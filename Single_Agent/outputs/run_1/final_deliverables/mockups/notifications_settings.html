<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notifications Settings</title>
  <style>
    :root {
      --primary: #0d6efd;
      --neutral: #f8f9fa;
      --text: #212529;
      --border: #dee2e6;
      --error: #dc3545;
    }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--neutral); color: var(--text); margin: 0; }
    header { padding: 1rem; background: var(--primary); color: #fff; }
    main { max-width: 500px; margin: 2rem auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); padding: 2rem; }
    .toggle { display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem; }
    .toggle input[type="checkbox"] { width: 24px; height: 24px; }
    .teams-list { margin-bottom: 2rem; }
    .team { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
    .notification-preview { background: #e7f1ff; border: 1px solid var(--primary); border-radius: 4px; padding: 1rem; margin-bottom: 1rem; }
    .error { color: var(--error); margin-bottom: 1rem; }
  </style>
</head>
<body>
  <header>
    <h1>Notifications Settings</h1>
  </header>
  <main>
    <div class="toggle">
      <label for="notif-toggle">Enable Notifications</label>
      <input id="notif-toggle" type="checkbox" checked>
    </div>
    <div class="teams-list">
      <div class="team"><input type="checkbox" checked> FC Barcelona</div>
      <div class="team"><input type="checkbox"> Manchester United</div>
      <div class="team"><input type="checkbox"> Real Madrid</div>
    </div>
    <div class="notification-preview">
      <strong>Sample Notification:</strong> Barcelona wins El Clasico! Tap for details.
    </div>
    <div class="error" style="display:none;">Push notification permission denied. Please enable in device settings.</div>
  </main>
</body>
</html>
