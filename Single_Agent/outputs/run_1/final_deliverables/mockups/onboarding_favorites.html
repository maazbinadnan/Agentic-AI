<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Onboarding - Select Favorites</title>
  <style>
    :root {
      --primary: #0d6efd;
      --neutral: #f8f9fa;
      --text: #212529;
      --border: #dee2e6;
      --error: #dc3545;
    }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--neutral); color: var(--text); margin: 0; }
    header { padding: 1rem; background: var(--primary); color: #fff; }
    main { max-width: 600px; margin: 2rem auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); padding: 2rem; }
    h2 { margin-top: 0; }
    .teams-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2rem; }
    .team { border: 1px solid var(--border); border-radius: 6px; padding: 1rem; text-align: center; cursor: pointer; background: var(--neutral); transition: border 0.2s; }
    .team.selected { border: 2px solid var(--primary); background: #e7f1ff; }
    .channels-list { margin-bottom: 2rem; }
    .channel { display: flex; align-items: center; margin-bottom: 0.5rem; }
    .channel input { margin-right: 0.5rem; }
    .error { color: var(--error); margin-bottom: 1rem; }
    .actions { text-align: right; }
    button { background: var(--primary); color: #fff; border: none; border-radius: 4px; padding: 0.75rem 1.5rem; font-size: 1rem; cursor: pointer; }
    button:disabled { background: var(--border); color: var(--text); cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>Welcome! Select Your Favorites</h1>
  </header>
  <main>
    <h2>Choose Your Favorite Teams</h2>
    <div class="teams-grid">
      <div class="team selected">FC Barcelona</div>
      <div class="team">Manchester United</div>
      <div class="team">Real Madrid</div>
      <div class="team">Liverpool</div>
      <div class="team">Bayern Munich</div>
      <div class="team">Juventus</div>
    </div>
    <h2>Choose Sports Channels</h2>
    <div class="channels-list">
      <label class="channel"><input type="checkbox" checked> ESPN</label>
      <label class="channel"><input type="checkbox"> Sky Sports</label>
      <label class="channel"><input type="checkbox"> DAZN</label>
    </div>
    <div class="error" style="display:none;">Please select at least one team and one channel.</div>
    <div class="actions">
      <button>Save Preferences</button>
    </div>
  </main>
</body>
</html>
