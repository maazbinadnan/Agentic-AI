<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Registration & Login</title>
  <style>
    :root {
      --primary: #0d6efd;
      --neutral: #f8f9fa;
      --text: #212529;
      --border: #dee2e6;
      --error: #dc3545;
    }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--neutral); color: var(--text); margin: 0; }
    main { max-width: 400px; margin: 2rem auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); padding: 2rem; }
    h2 { margin-top: 0; }
    form { display: flex; flex-direction: column; gap: 1rem; }
    label { font-weight: 500; }
    input { padding: 0.5rem; border: 1px solid var(--border); border-radius: 4px; font-size: 1rem; }
    .actions { display: flex; gap: 1rem; }
    button { background: var(--primary); color: #fff; border: none; border-radius: 4px; padding: 0.75rem 1.5rem; font-size: 1rem; cursor: pointer; }
    .error { color: var(--error); margin-bottom: 1rem; }
  </style>
</head>
<body>
  <main>
    <h2>Register</h2>
    <form>
      <label for="reg-email">Email</label>
      <input id="reg-email" type="email" required>
      <label for="reg-password">Password</label>
      <input id="reg-password" type="password" required>
      <div class="actions">
        <button type="submit">Register</button>
        <button type="button">Quick Access</button>
      </div>
      <div class="error" style="display:none;">Invalid input. Please check your email and password.</div>
    </form>
    <h2>Login</h2>
    <form>
      <label for="login-email">Email</label>
      <input id="login-email" type="email" required>
      <label for="login-password">Password</label>
      <input id="login-password" type="password" required>
      <div class="actions">
        <button type="submit">Login</button>
      </div>
      <div class="error" style="display:none;">Invalid input. Please check your email and password.</div>
    </form>
  </main>
</body>
</html>
