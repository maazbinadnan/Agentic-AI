<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Match Detail - Live Stream</title>
  <style>
    :root {
      --primary: #0d6efd;
      --neutral: #f8f9fa;
      --text: #212529;
      --border: #dee2e6;
      --error: #dc3545;
    }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--neutral); color: var(--text); margin: 0; }
    header { padding: 1rem; background: var(--primary); color: #fff; }
    main { max-width: 600px; margin: 2rem auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); padding: 2rem; }
    .match-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .stream-link { background: #e7f1ff; border: 1px solid var(--primary); border-radius: 4px; padding: 1rem; text-align: center; margin-bottom: 1rem; }
    .error { color: var(--error); background: #fff3f3; border: 1px solid var(--error); border-radius: 4px; padding: 1rem; margin-bottom: 1rem; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>Match Details</h1>
  </header>
  <main>
    <div class="match-header">
      <div>
        <h2>Barcelona vs Real Madrid</h2>
        <p>Date: 2024-06-15 | Time: 20:00</p>
      </div>
      <div>
        <span>Live</span>
      </div>
    </div>
    <div class="stream-link">Watch Live: <a href="#">Stream Link</a></div>
    <div class="error" style="display:none;">Live stream not available in your country.</div>
  </main>
</body>
</html>
