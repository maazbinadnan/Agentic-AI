<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Main Navigation</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
      --color-border: #dee2e6;
      --color-active: #0d6efd;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #fff;
      border-top: 1px solid var(--color-border);
      display: flex;
      justify-content: space-around;
      padding: 0.5rem 0;
      z-index: 10;
    }
    .nav-item {
      flex: 1;
      text-align: center;
      color: var(--color-text);
      font-size: 1rem;
      padding: 0.5rem 0;
      cursor: pointer;
      transition: color 0.2s;
    }
    .nav-item.active {
      color: var(--color-active);
      font-weight: bold;
      border-bottom: 2px solid var(--color-active);
    }
  </style>
</head>
<body>
  <main>
    <h2>Select a feature from the navigation below</h2>
  </main>
  <nav class="nav-bar" aria-label="Main navigation">
    <div class="nav-item active">News</div>
    <div class="nav-item">Live Ticker</div>
    <div class="nav-item">Streams</div>
    <div class="nav-item">Teams/Players</div>
  </nav>
</body>
</html>
