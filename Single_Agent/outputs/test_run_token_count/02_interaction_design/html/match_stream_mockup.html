<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Match Stream Link</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
      --color-border: #dee2e6;
      --color-error: #dc3545;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 2rem;
      margin-top: 2rem;
      width: 420px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    h2 {
      text-align: center;
      margin-bottom: 1rem;
    }
    .match-info {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      font-size: 1rem;
    }
    .stream-link {
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      cursor: pointer;
      text-align: center;
      margin-top: 1rem;
      transition: background 0.2s;
      display: inline-block;
    }
    .stream-link:hover {
      background: #0b5ed7;
    }
    .rights-unavailable {
      color: var(--color-error);
      font-size: 1rem;
      margin-top: 1rem;
      text-align: center;
    }
    .error {
      color: var(--color-error);
      font-size: 0.95rem;
      margin-top: 0.5rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Match Details</h2>
    <div class="match-info">
      <div><strong>Barcelona vs Real Madrid</strong></div>
      <div>La Liga &middot; 2024-06-10 &middot; 21:00</div>
      <div>Score: 2 - 1</div>
    </div>
    <!-- Populated State: Rights available -->
    <a class="stream-link" href="#">Watch Live Stream</a>
    <!-- Rights unavailable state -->
    <div class="rights-unavailable" style="display:none;">Live stream not available in your country.</div>
    <!-- Error State Example -->
    <div class="error" style="display:none;">Failed to load stream link.</div>
  </div>
</body>
</html>
