<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Ticker - Favorite Teams</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
      --color-border: #dee2e6;
      --color-error: #dc3545;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 2rem;
      margin-top: 2rem;
      width: 420px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    h2 {
      text-align: center;
      margin-bottom: 1rem;
    }
    .ticker-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .match-card {
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: 4px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .match-title {
      font-weight: bold;
      font-size: 1.1rem;
    }
    .match-score {
      font-size: 1.2rem;
      color: var(--color-primary);
      font-weight: bold;
    }
    .match-meta {
      font-size: 0.95rem;
      color: #6c757d;
    }
    .empty {
      text-align: center;
      color: #6c757d;
      margin-top: 2rem;
    }
    .error {
      color: var(--color-error);
      font-size: 0.95rem;
      margin-top: 0.5rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Live Match Results</h2>
    <div class="ticker-list">
      <!-- Populated State Example -->
      <div class="match-card">
        <div class="match-title">Barcelona vs Real Madrid</div>
        <div class="match-score">2 - 1</div>
        <div class="match-meta">78' &middot; La Liga</div>
      </div>
      <div class="match-card">
        <div class="match-title">Manchester United vs Liverpool</div>
        <div class="match-score">1 - 1</div>
        <div class="match-meta">65' &middot; Premier League</div>
      </div>
    </div>
    <!-- Empty State Example -->
    <div class="empty" style="display:none;">No live matches for your selected teams.</div>
    <!-- Error State Example -->
    <div class="error" style="display:none;">Failed to load live results. Please try again.</div>
  </div>
</body>
</html>
