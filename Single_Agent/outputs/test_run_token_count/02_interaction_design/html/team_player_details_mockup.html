<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team & Player Details</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
      --color-border: #dee2e6;
      --color-error: #dc3545;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 2rem;
      margin-top: 2rem;
      width: 420px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    h2 {
      text-align: center;
      margin-bottom: 1rem;
    }
    .profile-section {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .profile-header {
      font-size: 1.2rem;
      font-weight: bold;
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      font-size: 1rem;
    }
    .stats div {
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: 4px;
      padding: 0.5rem;
      text-align: center;
    }
    .empty {
      text-align: center;
      color: #6c757d;
      margin-top: 2rem;
    }
    .error {
      color: var(--color-error);
      font-size: 0.95rem;
      margin-top: 0.5rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Team & Player Details</h2>
    <section class="profile-section">
      <!-- Team Profile Example -->
      <div class="profile-header">FC Barcelona</div>
      <div class="stats">
        <div>Wins: 22</div>
        <div>Losses: 5</div>
        <div>Draws: 7</div>
        <div>Goals: 68</div>
      </div>
    </section>
    <section class="profile-section">
      <!-- Player Profile Example -->
      <div class="profile-header">Lionel Messi</div>
      <div class="stats">
        <div>Appearances: 30</div>
        <div>Goals: 25</div>
        <div>Assists: 12</div>
        <div>Yellow Cards: 2</div>
      </div>
    </section>
    <!-- Empty State Example -->
    <div class="empty" style="display:none;">No details available for selected team/player.</div>
    <!-- Error State Example -->
    <div class="error" style="display:none;">Failed to load details. Please try again.</div>
  </div>
</body>
</html>
