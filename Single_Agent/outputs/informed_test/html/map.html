<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAZ Map</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f7f7f7; }
    header { background: #2c3e50; color: #fff; padding: 1rem; text-align: center; }
    nav { background: #34495e; display: flex; justify-content: center; }
    nav a { color: #fff; padding: 1rem; text-decoration: none; transition: background 0.2s; }
    nav a:hover { background: #2c3e50; }
    main { max-width: 900px; margin: 2rem auto; background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    h1 { margin-top: 0; }
    .map-container { width: 100%; height: 400px; background: #e1e1e1; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 1rem; }
    .legend { margin-top: 1rem; }
    @media (max-width: 600px) { main { padding: 1rem; } .map-container { height: 200px; } nav { flex-direction: column; } }
  </style>
</head>
<body>
  <header>
    <h1>CAZ Interactive Map</h1>
  </header>
  <nav>
    <a href="home.html"><i class="fa fa-home"></i> Home</a>
    <a href="map.html"><i class="fa fa-map"></i> CAZ Map</a>
    <a href="compliance.html"><i class="fa fa-car"></i> Vehicle Compliance</a>
    <a href="payment.html"><i class="fa fa-credit-card"></i> Payments</a>
    <a href="exemption.html"><i class="fa fa-id-badge"></i> Exemptions</a>
    <a href="support.html"><i class="fa fa-question-circle"></i> Support</a>
    <a href="alternatives.html"><i class="fa fa-road"></i> Alternatives</a>
    <a href="signposting.html"><i class="fa fa-road"></i> Signposting</a>
    <a href="refund.html"><i class="fa fa-undo"></i> Refunds</a>
    <a href="pcn.html"><i class="fa fa-exclamation-triangle"></i> PCN</a>
  </nav>
  <main>
    <div class="map-container">
      <span style="color:#888;">[Interactive Map Placeholder]</span>
    </div>
    <div>
      <label for="caz-select">Select CAZ:</label>
      <select id="caz-select">
        <option>City A</option>
        <option>City B</option>
        <option>City C</option>
      </select>
      <span style="margin-left:1rem;">Activation Time: <strong>06:00 - 22:00</strong></span>
    </div>
    <div class="legend">
      <strong>Legend:</strong> <span style="background:#27ae60; color:#fff; padding:2px 8px; border-radius:4px;">Compliant</span> <span style="background:#e74c3c; color:#fff; padding:2px 8px; border-radius:4px;">Non-Compliant</span>
    </div>
  </main>
</body>
</html>
