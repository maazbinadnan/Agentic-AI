<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAZ Exemptions</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f7f7f7; }
    header { background: #2c3e50; color: #fff; padding: 1rem; text-align: center; }
    nav { background: #34495e; display: flex; justify-content: center; }
    nav a { color: #fff; padding: 1rem; text-decoration: none; transition: background 0.2s; }
    nav a:hover { background: #2c3e50; }
    main { max-width: 600px; margin: 2rem auto; background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    h1 { margin-top: 0; }
    form { display: flex; flex-direction: column; gap: 1rem; }
    label { font-weight: bold; }
    input, select { padding: 0.5rem; border-radius: 4px; border: 1px solid #ccc; }
    button { background: #27ae60; color: #fff; border: none; padding: 0.75rem; border-radius: 4px; font-size: 1rem; cursor: pointer; }
    button:hover { background: #219150; }
    .info { margin-bottom: 1rem; }
    .confirmation { margin-top: 1rem; padding: 1rem; border-radius: 6px; background: #e1f7e7; color: #222; display: none; }
    @media (max-width: 600px) { main { padding: 1rem; } nav { flex-direction: column; } }
  </style>
</head>
<body>
  <header>
    <h1>CAZ Exemptions</h1>
  </header>
  <nav>
    <a href="home.html"><i class="fa fa-home"></i> Home</a>
    <a href="map.html"><i class="fa fa-map"></i> CAZ Map</a>
    <a href="compliance.html"><i class="fa fa-car"></i> Vehicle Compliance</a>
    <a href="payment.html"><i class="fa fa-credit-card"></i> Payments</a>
    <a href="exemption.html"><i class="fa fa-id-badge"></i> Exemptions</a>
    <a href="support.html"><i class="fa fa-question-circle"></i> Support</a>
    <a href="alternatives.html"><i class="fa fa-road"></i> Alternatives</a>
    <a href="signposting.html"><i class="fa fa-road"></i> Signposting</a>
    <a href="refund.html"><i class="fa fa-undo"></i> Refunds</a>
    <a href="pcn.html"><i class="fa fa-exclamation-triangle"></i> PCN</a>
  </nav>
  <main>
    <div class="info">
      <p>Check if you are eligible for a CAZ exemption and apply below.</p>
    </div>
    <form>
      <label for="reg">Vehicle Registration Number</label>
      <input type="text" id="reg" name="reg" placeholder="e.g. AB12 CDE" required>
      <label for="ex-type">Exemption Type</label>
      <select id="ex-type" name="ex-type">
        <option>Disabled Tax Class</option>
        <option>Emergency Vehicle</option>
        <option>Historic Vehicle</option>
        <option>Other</option>
      </select>
      <button type="submit">Check & Apply</button>
    </form>
    <div class="confirmation" id="confirmation">
      <strong>Application Submitted!</strong> Your exemption request has been received.
    </div>
  </main>
</body>
</html>
