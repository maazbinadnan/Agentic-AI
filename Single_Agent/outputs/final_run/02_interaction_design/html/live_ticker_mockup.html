<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Ticker - Real-Time Results</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
      --color-border: #dee2e6;
      --color-error: #dc3545;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      margin: 0;
      min-height: 100vh;
    }
    .ticker-container {
      max-width: 600px;
      margin: 2rem auto;
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      padding: 2rem 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .ticker-header {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    .match-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .match-card {
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: 4px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      position: relative;
    }
    .match-title {
      font-size: 1.1rem;
      font-weight: 500;
    }
    .match-status {
      font-size: 0.95rem;
      color: #6c757d;
    }
    .match-score {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--color-primary);
    }
    .empty-state {
      text-align: center;
      color: #6c757d;
      font-size: 1rem;
      margin-top: 2rem;
    }
    .error-message {
      color: var(--color-error);
      font-size: 0.95rem;
      margin-top: 0.5rem;
      text-align: left;
    }
  </style>
</head>
<body>
  <main>
    <section class="ticker-container">
      <div class="ticker-header">Live Results for Your Favorite Teams</div>
      <div class="match-list">
        <article class="match-card">
          <div class="match-title">Manchester United vs. Liverpool</div>
          <div class="match-status">Live &middot; 65'</div>
          <div class="match-score">2 - 1</div>
        </article>
        <article class="match-card">
          <div class="match-title">Real Madrid vs. FC Barcelona</div>
          <div class="match-status">Live &middot; 72'</div>
          <div class="match-score">1 - 1</div>
        </article>
      </div>
      <!-- Empty State Example -->
      <div class="empty-state" style="display:none;">No live matches for your selected teams.</div>
      <!-- Error State Example -->
      <div class="error-message" style="display:none;">Failed to load live results. Please try again.</div>
    </section>
  </main>
</body>
</html>
