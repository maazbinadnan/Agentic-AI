<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Match Details & Live Stream</title>
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-primary: #0d6efd;
      --color-text: #212529;
      --color-border: #dee2e6;
      --color-error: #dc3545;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      margin: 0;
      min-height: 100vh;
    }
    .match-details-container {
      max-width: 500px;
      margin: 2rem auto;
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      padding: 2rem 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .match-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .match-meta {
      font-size: 0.95rem;
      color: #6c757d;
      margin-bottom: 0.5rem;
    }
    .stream-link {
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 0.6rem 1.5rem;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 1rem;
      transition: background 0.2s;
      text-decoration: none;
      display: inline-block;
    }
    .stream-link:hover {
      background: #0b5ed7;
    }
    .rights-message {
      color: var(--color-error);
      font-size: 1rem;
      margin-top: 1rem;
      text-align: left;
    }
    .error-message {
      color: var(--color-error);
      font-size: 0.95rem;
      margin-top: 0.5rem;
      text-align: left;
    }
  </style>
</head>
<body>
  <main>
    <section class="match-details-container">
      <div class="match-title">Manchester United vs. Liverpool</div>
      <div class="match-meta">Date: 2024-05-12 &middot; Time: 18:00 &middot; Stadium: Old Trafford</div>
      <!-- Populated State: Live stream permitted -->
      <a class="stream-link" href="#">Watch Live Stream</a>
      <!-- Error State: Rights restriction -->
      <div class="rights-message" style="display:none;">Live stream not available in your country due to broadcast rights restrictions.</div>
      <!-- Error State Example -->
      <div class="error-message" style="display:none;">Failed to load match details. Please try again.</div>
    </section>
  </main>
</body>
</html>
