<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Ticker - LiveFootball</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .ticker-header { background: #1b263b; color: #fff; padding: 1rem; border-radius: 8px; }
    .match-card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 1rem; }
    .event-update { font-size: 0.95rem; color: #495057; }
    .error-banner { background: #ffc107; color: #222; }
  </style>
</head>
<body>
  <div class="container py-3">
    <div class="ticker-header mb-3">
      <h2 class="mb-0">Live Ticker</h2>
      <span class="small">Real-time match updates</span>
    </div>
    <div id="error-banner" class="error-banner p-2 mb-3 d-none rounded text-center">
      Live data unavailable. Showing cached or partial results.
    </div>
    <div class="match-card p-3 mb-2">
      <div class="d-flex justify-content-between align-items-center">
        <div><strong>Liverpool</strong> vs <strong>Real Madrid</strong></div>
        <span class="badge bg-success">Live</span>
      </div>
      <div class="d-flex justify-content-between align-items-center mt-2">
        <span>2</span>
        <span>-</span>
        <span>1</span>
      </div>
      <div class="event-update mt-2">78' Goal by Salah (LIV)</div>
    </div>
    <div class="match-card p-3 mb-2">
      <div class="d-flex justify-content-between align-items-center">
        <div><strong>Juventus</strong> vs <strong>PSG</strong></div>
        <span class="badge bg-secondary">FT</span>
      </div>
      <div class="d-flex justify-content-between align-items-center mt-2">
        <span>0</span>
        <span>-</span>
        <span>2</span>
      </div>
      <div class="event-update mt-2">Full Time</div>
    </div>
    <!-- More match cards... -->
  </div>
  <script>
    // Simulate error state for demo
    // document.getElementById('error-banner').classList.remove('d-none');
  </script>
</body>
</html>
