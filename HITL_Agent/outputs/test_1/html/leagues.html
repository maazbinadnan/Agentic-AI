<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leagues & Competitions - LiveFootball</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .league-card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 1rem; }
    .error-banner { background: #ffc107; color: #222; }
  </style>
</head>
<body>
  <div class="container py-3">
    <h2 class="mb-3">Leagues & Competitions</h2>
    <div class="mb-3">
      <input type="text" class="form-control" placeholder="Search leagues or competitions...">
    </div>
    <div id="error-banner" class="error-banner p-2 mb-3 d-none rounded text-center">
      League data unavailable. Please try again later.
    </div>
    <div class="row g-3">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="league-card p-3">
          <div class="d-flex align-items-center gap-2">
            <img src="https://img.icons8.com/color/36/000000/premier-league.png" alt="Premier League">
            <div>
              <h5 class="mb-0">Premier League</h5>
              <span class="text-muted">England</span>
            </div>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="league-card p-3">
          <div class="d-flex align-items-center gap-2">
            <img src="https://img.icons8.com/color/36/000000/la-liga.png" alt="La Liga">
            <div>
              <h5 class="mb-0">La Liga</h5>
              <span class="text-muted">Spain</span>
            </div>
          </div>
        </div>
      </div>
      <!-- More league cards... -->
    </div>
  </div>
  <script>
    // Simulate error state for demo
    // document.getElementById('error-banner').classList.remove('d-none');
  </script>
</body>
</html>
