<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveFootball - Loading</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #0d1b2a; color: #fff; }
    .logo { width: 100px; animation: bounce 1.2s infinite alternate; }
    @keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-20px); } }
    .loading-text { letter-spacing: 2px; }
  </style>
</head>
<body class="d-flex flex-column justify-content-center align-items-center vh-100">
  <img src="https://img.icons8.com/ios-filled/100/ffffff/soccer-ball.png" alt="LiveFootball Logo" class="logo mb-4">
  <h1 class="mb-3">LiveFootball</h1>
  <div class="spinner-border text-light mb-3" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
  <div class="loading-text mb-2">Loading, please wait...</div>
  <div id="error-message" class="alert alert-danger d-none mt-3" role="alert">
    The app is taking longer than expected to load. Please check your connection or try again later.
  </div>
  <script>
    // Simulate delayed loading for error state demo
    setTimeout(() => {
      document.getElementById('error-message').classList.remove('d-none');
    }, 3000);
  </script>
</body>
</html>
