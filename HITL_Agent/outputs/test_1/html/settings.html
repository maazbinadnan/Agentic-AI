<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - LiveFootball</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .settings-card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 1rem; }
    .gdpr-link { color: #1b263b; text-decoration: underline; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container py-3">
    <h2 class="mb-3">Settings & Personalization</h2>
    <div class="settings-card p-3 mb-3">
      <h5>Favorite Teams</h5>
      <select class="form-select mb-2" multiple>
        <option>Liverpool</option>
        <option>Real Madrid</option>
        <option>Juventus</option>
        <option>FC Barcelona</option>
      </select>
      <h5 class="mt-3">Preferred Channels</h5>
      <select class="form-select mb-2" multiple>
        <option>Sky Sport</option>
        <option>DAZN</option>
        <option>BT Sport</option>
      </select>
      <div class="form-check form-switch mt-3">
        <input class="form-check-input" type="checkbox" id="notificationsToggle">
        <label class="form-check-label" for="notificationsToggle">Enable Notifications</label>
      </div>
    </div>
    <div class="settings-card p-3 mb-3">
      <h5>Privacy & GDPR</h5>
      <p>Your data is processed in compliance with GDPR. <span class="gdpr-link" onclick="window.location='gdpr.html'">Learn more or request data deletion</span>.</p>
      <button class="btn btn-outline-danger">Request Data Deletion</button>
    </div>
  </div>
</body>
</html>
