<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GDPR & Privacy - LiveFootball</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .gdpr-card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin: 2rem auto; max-width: 600px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="gdpr-card p-4">
      <h2>GDPR & Privacy</h2>
      <p>Your privacy is important to us. All personal data is processed in compliance with the General Data Protection Regulation (GDPR). You can request to view or delete your data at any time.</p>
      <form>
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input type="email" class="form-control" id="email" required>
        </div>
        <button type="submit" class="btn btn-danger mb-2">Request Data Deletion</button>
        <button type="button" class="btn btn-outline-primary mb-2">Request Data Export</button>
      </form>
      <div class="alert alert-info mt-3" role="alert">
        We will process your request and confirm via email within 30 days.
      </div>
    </div>
  </div>
</body>
</html>
