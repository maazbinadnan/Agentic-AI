<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - LiveFootball</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #1b263b; color: #fff; }
    .card { background: #222f43; }
    .btn-google { background: #fff; color: #222; border: 1px solid #ccc; }
    .btn-facebook { background: #1877f2; color: #fff; }
    .gdpr-text { font-size: 0.9rem; color: #adb5bd; }
  </style>
</head>
<body class="d-flex flex-column justify-content-center align-items-center vh-100">
  <div class="card p-4 shadow" style="min-width: 320px; max-width: 350px;">
    <h2 class="mb-3 text-center">Sign In</h2>
    <div id="error-banner" class="alert alert-danger d-none" role="alert">
      Login failed. Please check your credentials and try again.
    </div>
    <form>
      <div class="mb-3">
        <label for="email" class="form-label">Email address</label>
        <input type="email" class="form-control" id="email" required autocomplete="username">
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" required autocomplete="current-password">
      </div>
      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="rememberMe">
        <label class="form-check-label" for="rememberMe">Remember me</label>
      </div>
      <button type="submit" class="btn btn-primary w-100 mb-2">Login</button>
      <div class="d-flex gap-2 mb-2">
        <button type="button" class="btn btn-google w-50"><img src="https://img.icons8.com/color/16/000000/google-logo.png"/> Google</button>
        <button type="button" class="btn btn-facebook w-50"><img src="https://img.icons8.com/ios-filled/16/ffffff/facebook-new.png"/> Facebook</button>
      </div>
      <div class="gdpr-text mb-2">
        By signing in, you agree to our <a href="#" class="link-light">GDPR-compliant privacy policy</a>.
      </div>
      <div class="text-center">
        <a href="#" class="link-light">Register</a> | <a href="#" class="link-light">Forgot password?</a>
      </div>
    </form>
  </div>
  <script>
    // Simulate login error for demo
    // document.getElementById('error-banner').classList.remove('d-none');
  </script>
</body>
</html>
