<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News Article - LiveFootball</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .article-card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin: 2rem auto; max-width: 600px; }
    .share-btn { background: #4267B2; color: #fff; }
    .error-banner { background: #ffc107; color: #222; }
  </style>
</head>
<body>
  <div class="container">
    <div class="article-card p-4">
      <h2>Champions League Final: Preview</h2>
      <p class="text-muted">By John Doe | 1 June 2024</p>
      <img src="https://images.unsplash.com/photo-1517649763962-0c623066013b?auto=format&fit=crop&w=600&q=80" class="img-fluid rounded mb-3" alt="Football News">
      <p>The Champions League final is set to be an epic showdown between two of Europe's top clubs. Fans around the world are eagerly awaiting kickoff...</p>
      <button class="btn share-btn me-2"><img src="https://img.icons8.com/ios-filled/16/ffffff/share.png"/> Share to Social</button>
    </div>
    <div id="error-banner" class="error-banner p-2 mt-3 d-none rounded text-center">
      Sharing failed. Please try again.
    </div>
  </div>
  <script>
    // Simulate sharing error for demo
    // document.getElementById('error-banner').classList.remove('d-none');
  </script>
</body>
</html>
