<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LiveFootball App – Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-[#0F172A] min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md bg-[#1E293B] rounded-xl shadow-lg p-8 space-y-6">
    <h1 class="text-2xl font-bold text-white text-center mb-2">Welcome to LiveFootball</h1>
    <form class="space-y-4">
      <div>
        <label class="block text-gray-300 mb-1" for="email">Email</label>
        <input id="email" name="email" type="email" required class="w-full px-4 py-2 rounded-lg bg-[#0F172A] text-white border border-[#3B82F6] focus:outline-none focus:ring-2 focus:ring-[#3B82F6]" placeholder="you@email.com" />
      </div>
      <div>
        <label class="block text-gray-300 mb-1" for="password">Password</label>
        <input id="password" name="password" type="password" required class="w-full px-4 py-2 rounded-lg bg-[#0F172A] text-white border border-[#3B82F6] focus:outline-none focus:ring-2 focus:ring-[#3B82F6]" placeholder="••••••••" />
      </div>
      <div class="flex items-center justify-between">
        <label class="flex items-center text-gray-400">
          <input type="checkbox" class="form-checkbox accent-[#3B82F6] mr-2" />
          Remember me
        </label>
        <a href="#" class="text-sm text-[#3B82F6] hover:underline">Forgot password?</a>
      </div>
      <button type="submit" class="w-full py-2 bg-[#3B82F6] hover:bg-[#2563EB] text-white font-semibold rounded-lg transition">Login</button>
    </form>
    <div class="flex items-center my-4">
      <div class="flex-grow border-t border-gray-600"></div>
      <span class="mx-2 text-gray-400 text-sm">or</span>
      <div class="flex-grow border-t border-gray-600"></div>
    </div>
    <div class="flex flex-col gap-2">
      <button class="w-full flex items-center justify-center gap-2 py-2 bg-white text-[#0F172A] font-semibold rounded-lg hover:bg-gray-200 transition"><img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5">Login with Google</button>
      <button class="w-full flex items-center justify-center gap-2 py-2 bg-[#1877F2] text-white font-semibold rounded-lg hover:bg-[#145db2] transition"><img src="https://www.svgrepo.com/show/448224/facebook.svg" alt="Facebook" class="w-5 h-5">Login with Facebook</button>
    </div>
    <div class="text-center text-gray-400 text-sm mt-4">
      Don’t have an account? <a href="#" class="text-[#3B82F6] hover:underline">Register</a>
    </div>
    <!-- Error banner example -->
    <div class="hidden mt-4 bg-red-600 text-white text-center py-2 rounded-lg" id="error-banner">
      Invalid credentials. Please try again.
    </div>
    <div class="text-xs text-gray-500 text-center mt-4">
      By logging in, you agree to our <a href="#" class="underline">Privacy Policy (GDPR)</a>.
    </div>
  </div>
</body>
</html>
