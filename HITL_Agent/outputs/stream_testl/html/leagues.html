<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LiveFootball App – Leagues</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#0F172A] min-h-screen">
  <header class="flex items-center justify-between px-4 py-3 bg-[#1E293B] shadow-md">
    <a href="dashboard.html" class="text-[#3B82F6] hover:text-white">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
    </a>
    <span class="text-xl font-bold text-white">Leagues</span>
    <a href="settings.html" class="text-[#3B82F6] hover:text-white">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
    </a>
  </header>
  <main class="px-4 py-6 max-w-2xl mx-auto">
    <section>
      <h2 class="text-lg font-semibold text-white mb-4">All Leagues & Competitions</h2>
      <div class="space-y-4">
        <div class="bg-[#1E293B] rounded-xl shadow p-4 flex items-center justify-between">
          <div>
            <h3 class="text-white font-bold text-base">Premier League</h3>
            <p class="text-gray-300 text-sm">England</p>
          </div>
          <a href="#" class="text-[#3B82F6] text-sm hover:underline">View</a>
        </div>
        <div class="bg-[#1E293B] rounded-xl shadow p-4 flex items-center justify-between">
          <div>
            <h3 class="text-white font-bold text-base">La Liga</h3>
            <p class="text-gray-300 text-sm">Spain</p>
          </div>
          <a href="#" class="text-[#3B82F6] text-sm hover:underline">View</a>
        </div>
        <div class="bg-[#1E293B] rounded-xl shadow p-4 flex items-center justify-between">
          <div>
            <h3 class="text-white font-bold text-base">Bundesliga</h3>
            <p class="text-gray-300 text-sm">Germany</p>
          </div>
          <a href="#" class="text-[#3B82F6] text-sm hover:underline">View</a>
        </div>
      </div>
      <!-- Error state example -->
      <div class="hidden mt-4 bg-red-600 text-white text-center py-2 rounded-lg" id="error-banner">
        League not supported or unavailable.
      </div>
    </section>
  </main>
</body>
</html>
