<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LiveFootball App – Live Ticker</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#0F172A] min-h-screen">
  <header class="flex items-center justify-between px-4 py-3 bg-[#1E293B] shadow-md">
    <a href="dashboard.html" class="text-[#3B82F6] hover:text-white">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
    </a>
    <span class="text-xl font-bold text-white">Live Ticker</span>
    <a href="settings.html" class="text-[#3B82F6] hover:text-white">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
    </a>
  </header>
  <main class="px-4 py-6 max-w-2xl mx-auto">
    <section class="bg-[#1E293B] rounded-xl shadow p-4 mb-6">
      <h2 class="text-lg font-semibold text-white mb-2">Select Team</h2>
      <select class="w-full px-3 py-2 rounded-lg bg-[#0F172A] text-white border border-[#3B82F6] focus:outline-none focus:ring-2 focus:ring-[#3B82F6]">
        <option>Liverpool</option>
        <option>Real Madrid</option>
        <option>Barcelona</option>
      </select>
    </section>
    <section class="bg-[#1E293B] rounded-xl shadow p-4">
      <h2 class="text-lg font-semibold text-white mb-2">Live Match Updates</h2>
      <div class="space-y-3">
        <div class="flex items-center justify-between bg-[#0F172A] rounded-lg px-3 py-2">
          <span class="text-white font-medium">Liverpool vs Man City</span>
          <span class="text-[#10B981] font-bold">2 - 1</span>
          <span class="text-gray-400 text-xs">78'</span>
        </div>
        <div class="flex items-center justify-between bg-[#0F172A] rounded-lg px-3 py-2">
          <span class="text-white font-medium">Real Madrid vs Barcelona</span>
          <span class="text-[#10B981] font-bold">1 - 1</span>
          <span class="text-gray-400 text-xs">65'</span>
        </div>
      </div>
      <!-- Error state example -->
      <div class="hidden mt-4 bg-red-600 text-white text-center py-2 rounded-lg" id="error-banner">
        Live data unavailable. Please check your connection.
      </div>
    </section>
  </main>
</body>
</html>
