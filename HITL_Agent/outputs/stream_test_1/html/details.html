<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team/Player Details - LiveFootball App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8fafc; }
    .navbar { background: #0a192f; }
    .navbar-brand, .nav-link, .navbar-text { color: #fff !important; }
    .details-card { background: #fff; border-radius: 1rem; box-shadow: 0 2px 8px #0001; padding: 2rem; margin-top: 2rem; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem; }
    .error-banner { background: #dc3545; color: #fff; padding: 0.5rem 1rem; border-radius: 0.5rem; margin-bottom: 1rem; display: none; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="dashboard.html"><img src="https://img.icons8.com/ios-filled/32/ffffff/soccer-ball.png" style="margin-right:8px;">LiveFootball</a>
    </div>
  </nav>
  <div class="container">
    <div class="details-card">
      <div class="error-banner" id="detailsError">No information available for the selected team/player.</div>
      <div class="d-flex align-items-center mb-3">
        <img src="https://img.icons8.com/color/48/000000/football2.png" alt="Team Logo" class="me-3">
        <div>
          <h4 class="mb-0">Manchester United</h4>
          <div class="text-muted">Premier League</div>
        </div>
      </div>
      <div class="stats-grid">
        <div><strong>Wins:</strong> 18</div>
        <div><strong>Draws:</strong> 5</div>
        <div><strong>Losses:</strong> 3</div>
        <div><strong>Goals:</strong> 54</div>
      </div>
      <div class="mt-4">
        <h6>Recent Matches</h6>
        <ul class="list-group">
          <li class="list-group-item">Man Utd 2 - 1 Chelsea</li>
          <li class="list-group-item">Man Utd 1 - 0 Arsenal</li>
          <li class="list-group-item">Man Utd 3 - 2 Liverpool</li>
        </ul>
      </div>
    </div>
  </div>
  <nav class="navbar fixed-bottom navbar-light bg-light border-top">
    <div class="container justify-content-around">
      <a href="dashboard.html" class="nav-link text-center"><span class="bi bi-house"></span><br>Home</a>
      <a href="liveticker.html" class="nav-link text-center"><span class="bi bi-clock"></span><br>Live Ticker</a>
      <a href="details.html" class="nav-link text-center"><span class="bi bi-people"></span><br>Teams</a>
      <a href="settings.html" class="nav-link text-center"><span class="bi bi-gear"></span><br>Settings</a>
    </div>
  </nav>
  <script>
    // Simulate error for demo
    // document.getElementById('detailsError').style.display = 'block';
  </script>
</body>
</html>
