<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - LiveFootball App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #0a192f; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-box { background: #112240; padding: 2rem; border-radius: 1rem; box-shadow: 0 0 20px #0002; width: 100%; max-width: 350px; }
    .logo { width: 60px; margin-bottom: 1rem; }
    .gdpr { font-size: 0.9rem; color: #a0aec0; margin-top: 1rem; }
    .error-banner { background: #dc3545; color: #fff; padding: 0.5rem 1rem; border-radius: 0.5rem; margin-bottom: 1rem; display: none; }
  </style>
</head>
<body>
  <div class="login-box text-center">
    <img src="https://img.icons8.com/ios-filled/100/ffffff/soccer-ball.png" alt="App Logo" class="logo">
    <h4>Sign in to LiveFootball</h4>
    <div class="error-banner" id="loginError">Invalid credentials. Please try again.</div>
    <form>
      <div class="mb-3 text-start">
        <label for="email" class="form-label">Email address</label>
        <input type="email" class="form-control" id="email" placeholder="Enter email" required>
      </div>
      <div class="mb-3 text-start">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" placeholder="Password" required>
      </div>
      <button type="submit" class="btn btn-success w-100">Login</button>
      <div class="mt-3">
        <button type="button" class="btn btn-outline-light w-100 mb-2"><img src="https://img.icons8.com/color/24/000000/google-logo.png" style="margin-right:8px;">Sign in with Google</button>
        <button type="button" class="btn btn-outline-light w-100"><img src="https://img.icons8.com/ios-filled/24/3b5998/facebook-new.png" style="margin-right:8px;">Sign in with Facebook</button>
      </div>
      <div class="form-check mt-3 text-start">
        <input class="form-check-input" type="checkbox" value="" id="rememberMe">
        <label class="form-check-label" for="rememberMe">Remember me</label>
      </div>
      <div class="mt-3">
        <a href="#" class="link-light">Register</a> | <a href="#" class="link-light">Forgot password?</a>
      </div>
    </form>
    <div class="gdpr mt-4">
      By signing in, you agree to our <a href="#" class="link-info">Privacy Policy (GDPR)</a>.
    </div>
  </div>
  <script>
    // Simulate error for demo
    // document.getElementById('loginError').style.display = 'block';
  </script>
</body>
</html>
