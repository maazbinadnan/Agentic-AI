<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Stream - LiveFootball App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8fafc; }
    .navbar { background: #0a192f; }
    .navbar-brand, .nav-link, .navbar-text { color: #fff !important; }
    .stream-card { background: #fff; border-radius: 1rem; box-shadow: 0 2px 8px #0001; padding: 2rem; margin-top: 2rem; }
    .error-banner { background: #dc3545; color: #fff; padding: 0.5rem 1rem; border-radius: 0.5rem; margin-bottom: 1rem; display: none; }
    .info-banner { background: #0d6efd; color: #fff; padding: 0.5rem 1rem; border-radius: 0.5rem; margin-bottom: 1rem; display: none; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="dashboard.html"><img src="https://img.icons8.com/ios-filled/32/ffffff/soccer-ball.png" style="margin-right:8px;">LiveFootball</a>
    </div>
  </nav>
  <div class="container">
    <div class="stream-card text-center">
      <div class="error-banner" id="streamError">Live stream unavailable in your country due to rights restrictions.</div>
      <div class="info-banner" id="streamInfo">Live stream available! Transmission rights fulfilled.</div>
      <h5>Live Stream: Man Utd vs Chelsea</h5>
      <a href="https://dazn.com" target="_blank" class="btn btn-danger btn-lg mt-3">Watch on DAZN</a>
      <div class="mt-3 text-muted small">Live streams are only available where transmission rights are fulfilled.</div>
    </div>
  </div>
  <nav class="navbar fixed-bottom navbar-light bg-light border-top">
    <div class="container justify-content-around">
      <a href="dashboard.html" class="nav-link text-center"><span class="bi bi-house"></span><br>Home</a>
      <a href="liveticker.html" class="nav-link text-center"><span class="bi bi-clock"></span><br>Live Ticker</a>
      <a href="details.html" class="nav-link text-center"><span class="bi bi-people"></span><br>Teams</a>
      <a href="settings.html" class="nav-link text-center"><span class="bi bi-gear"></span><br>Settings</a>
    </div>
  </nav>
  <script>
    // Simulate info or error for demo
    // document.getElementById('streamInfo').style.display = 'block';
    // document.getElementById('streamError').style.display = 'block';
  </script>
</body>
</html>
