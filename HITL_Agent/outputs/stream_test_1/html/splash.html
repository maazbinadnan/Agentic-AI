<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveFootball App - Loading</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #0a192f; color: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; }
    .logo { width: 80px; margin-bottom: 1rem; }
    .loading-msg { font-size: 1.2rem; margin-top: 1rem; }
    .error-banner { background: #dc3545; color: #fff; padding: 0.5rem 1rem; border-radius: 0.5rem; margin-top: 1rem; display: none; }
  </style>
</head>
<body>
  <div class="text-center">
    <img src="https://img.icons8.com/ios-filled/100/ffffff/soccer-ball.png" alt="App Logo" class="logo">
    <div class="spinner-border text-success" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <div class="loading-msg">Loading LiveFootball... Please wait.</div>
    <div class="error-banner" id="errorBanner">Performance issues detected. Please try again later.</div>
  </div>
  <script>
    // Simulate error for slow loading (for demo)
    setTimeout(() => {
      document.getElementById('errorBanner').style.display = 'block';
    }, 3000);
  </script>
</body>
</html>
