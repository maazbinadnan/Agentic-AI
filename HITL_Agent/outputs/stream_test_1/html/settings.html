<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - LiveFootball App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8fafc; }
    .navbar { background: #0a192f; }
    .navbar-brand, .nav-link, .navbar-text { color: #fff !important; }
    .settings-card { background: #fff; border-radius: 1rem; box-shadow: 0 2px 8px #0001; padding: 2rem; margin-top: 2rem; }
    .error-banner { background: #dc3545; color: #fff; padding: 0.5rem 1rem; border-radius: 0.5rem; margin-bottom: 1rem; display: none; }
    .info-banner { background: #0d6efd; color: #fff; padding: 0.5rem 1rem; border-radius: 0.5rem; margin-bottom: 1rem; display: none; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="dashboard.html"><img src="https://img.icons8.com/ios-filled/32/ffffff/soccer-ball.png" style="margin-right:8px;">LiveFootball</a>
    </div>
  </nav>
  <div class="container">
    <div class="settings-card">
      <div class="error-banner" id="settingsError">Invalid configuration. Please check your input.</div>
      <div class="info-banner" id="settingsInfo">Settings updated successfully.</div>
      <h5>Settings & Personalization</h5>
      <form>
        <div class="mb-3">
          <label for="favoriteTeams" class="form-label">Favorite Teams</label>
          <select multiple class="form-select" id="favoriteTeams">
            <option>Manchester United</option>
            <option>Real Madrid</option>
            <option>FC Bayern</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="favoriteChannels" class="form-label">Favorite Sports Channels</label>
          <select multiple class="form-select" id="favoriteChannels">
            <option>DAZN</option>
            <option>Sky Sport</option>
            <option>ESPN</option>
          </select>
        </div>
        <div class="form-check form-switch mb-3">
          <input class="form-check-input" type="checkbox" id="notificationsSwitch">
          <label class="form-check-label" for="notificationsSwitch">Enable Notifications</label>
        </div>
        <div class="form-check form-switch mb-3">
          <input class="form-check-input" type="checkbox" id="offlineModeSwitch">
          <label class="form-check-label" for="offlineModeSwitch">Enable Offline Mode</label>
        </div>
        <div class="mb-3">
          <label class="form-label">Personalization</label>
          <input type="text" class="form-control" placeholder="Custom interface URL (optional)">
        </div>
        <div class="mb-3">
          <label class="form-label">GDPR & Privacy</label>
          <button type="button" class="btn btn-outline-danger btn-sm ms-2">Request Data Deletion</button>
        </div>
        <button type="submit" class="btn btn-success w-100">Save Settings</button>
      </form>
    </div>
  </div>
  <nav class="navbar fixed-bottom navbar-light bg-light border-top">
    <div class="container justify-content-around">
      <a href="dashboard.html" class="nav-link text-center"><span class="bi bi-house"></span><br>Home</a>
      <a href="liveticker.html" class="nav-link text-center"><span class="bi bi-clock"></span><br>Live Ticker</a>
      <a href="details.html" class="nav-link text-center"><span class="bi bi-people"></span><br>Teams</a>
      <a href="settings.html" class="nav-link text-center"><span class="bi bi-gear"></span><br>Settings</a>
    </div>
  </nav>
  <script>
    // Simulate info or error for demo
    // document.getElementById('settingsInfo').style.display = 'block';
    // document.getElementById('settingsError').style.display = 'block';
  </script>
</body>
</html>
