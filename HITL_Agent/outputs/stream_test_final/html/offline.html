<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveFootball App - Offline</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Roboto', sans-serif; background: #f8fafc; }
    .offline-container { max-width: 350px; margin: 10vh auto; background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); padding: 2rem; text-align: center; }
    .offline-icon { width: 64px; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="offline-container">
    <img src="https://img.icons8.com/ios-filled/100/ff0000/disconnected.png" alt="Offline" class="offline-icon">
    <h4>You're Offline</h4>
    <p class="text-muted">No internet connection detected. Some features may be unavailable.</p>
    <button class="btn btn-primary w-100 mb-2">Retry</button>
    <a href="#" class="btn btn-link w-100">Learn about offline mode</a>
  </div>
</body>
</html>
