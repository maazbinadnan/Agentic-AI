<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LiveFootball App – Settings</title>
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.classList.add('dark');
    }
  </script>
  <style>
    body { font-family: 'Roboto', sans-serif; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-[#181A1B] min-h-screen">
  <header class="flex items-center justify-between px-4 py-3 bg-white dark:bg-[#23272A] shadow-md sticky top-0 z-30">
    <button class="md:hidden text-[#0E2804] dark:text-[#3B82F6]" aria-label="Open navigation">
      <svg width="28" height="28" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <span class="text-xl font-bold text-[#0E2804] dark:text-[#3B82F6]">Settings</span>
    <div class="flex items-center gap-2">
      <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="User" class="w-8 h-8 rounded-full border-2 border-[#0E2804] dark:border-[#3B82F6]" />
    </div>
  </header>
  <main class="max-w-lg mx-auto px-4 py-6">
    <section class="mb-6">
      <h2 class="text-lg font-semibold text-[#0E2804] dark:text-[#3B82F6] mb-2">Personalization</h2>
      <form class="space-y-4">
        <div>
          <label class="block text-gray-700 dark:text-gray-200 mb-1" for="teams">Favorite Teams</label>
          <select id="teams" multiple class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-100 dark:bg-[#181A1B] focus:outline-none focus:ring-2 focus:ring-[#0E2804]">
            <option>Manchester United</option>
            <option>Real Madrid</option>
            <option>FC Barcelona</option>
            <option>Bayern Munich</option>
            <option>Juventus</option>
            <option>Paris Saint-Germain</option>
          </select>
        </div>
        <div>
          <label class="block text-gray-700 dark:text-gray-200 mb-1" for="channels">Preferred Sports Channels</label>
          <select id="channels" multiple class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-100 dark:bg-[#181A1B] focus:outline-none focus:ring-2 focus:ring-[#0E2804]">
            <option>DAZN</option>
            <option>Sky Sport</option>
            <option>ESPN</option>
            <option>BT Sport</option>
          </select>
        </div>
        <div class="flex items-center">
          <input id="notifications" type="checkbox" class="form-checkbox rounded text-[#0E2804] mr-2" />
          <label for="notifications" class="text-gray-700 dark:text-gray-200">Enable push notifications</label>
        </div>
        <button type="submit" class="w-full py-2 rounded-lg bg-[#0E2804] text-white font-semibold hover:bg-[#145c0a] transition">Save Changes</button>
      </form>
    </section>
    <section class="mb-6">
      <h2 class="text-lg font-semibold text-[#0E2804] dark:text-[#3B82F6] mb-2">App Preferences</h2>
      <div class="flex items-center justify-between py-2">
        <span class="text-gray-700 dark:text-gray-200">Dark Mode</span>
        <label class="inline-flex relative items-center cursor-pointer">
          <input type="checkbox" value="" class="sr-only peer">
          <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-[#0E2804] dark:bg-gray-700 rounded-full peer dark:peer-checked:bg-[#0E2804] after:content-[''] after:absolute after:top-0.5 after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:after:bg-gray-200 peer-checked:after:translate-x-full peer-checked:after:border-white"></div>
        </label>
      </div>
    </section>
    <section class="mb-6">
      <h2 class="text-lg font-semibold text-[#0E2804] dark:text-[#3B82F6] mb-2">Privacy & Security</h2>
      <div class="flex flex-col gap-2">
        <a href="#" class="text-[#3B82F6] hover:underline">View Privacy Policy</a>
        <a href="#" class="text-[#3B82F6] hover:underline">Manage Data Consent</a>
        <button class="text-red-600 dark:text-red-400 font-semibold hover:underline text-left">Delete Account</button>
      </div>
    </section>
    <!-- Offline/Sync banner example -->
    <div class="hidden mt-4 bg-yellow-100 dark:bg-yellow-900 text-yellow-700 dark:text-yellow-200 px-4 py-2 rounded-lg text-sm" id="offline-banner">
      You are offline. Changes will sync when connection is restored.
    </div>
    <!-- GDPR consent banner example -->
    <div class="hidden mt-4 bg-blue-100 dark:bg-blue-900 text-blue-700 dark:text-blue-200 px-4 py-2 rounded-lg text-sm" id="gdpr-banner">
      Please review and accept our updated privacy policy to continue using personalized features.
    </div>
  </main>
</body>
</html>
