<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LiveFootball App – Onboarding</title>
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.classList.add('dark');
    }
  </script>
  <style>
    body { font-family: 'Roboto', sans-serif; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-[#181A1B] min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md p-8 rounded-2xl shadow-lg bg-white dark:bg-[#23272A]">
    <h1 class="text-2xl font-bold text-[#0E2804] dark:text-[#3B82F6] mb-2">Welcome to LiveFootball</h1>
    <p class="text-gray-500 dark:text-gray-300 mb-6">Personalize your experience by selecting your favorite teams and sports channels.</p>
    <form class="space-y-6">
      <div>
        <label class="block text-gray-700 dark:text-gray-200 mb-2 font-medium" for="teams">Favorite Teams</label>
        <select id="teams" multiple class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-100 dark:bg-[#181A1B] focus:outline-none focus:ring-2 focus:ring-[#0E2804]">
          <option>Manchester United</option>
          <option>Real Madrid</option>
          <option>FC Barcelona</option>
          <option>Bayern Munich</option>
          <option>Juventus</option>
          <option>Paris Saint-Germain</option>
        </select>
        <p class="text-xs text-gray-400 mt-1">You can change this later in settings.</p>
      </div>
      <div>
        <label class="block text-gray-700 dark:text-gray-200 mb-2 font-medium" for="channels">Preferred Sports Channels</label>
        <select id="channels" multiple class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-100 dark:bg-[#181A1B] focus:outline-none focus:ring-2 focus:ring-[#0E2804]">
          <option>DAZN</option>
          <option>Sky Sport</option>
          <option>ESPN</option>
          <option>BT Sport</option>
        </select>
      </div>
      <div class="flex items-center">
        <input id="notifications" type="checkbox" class="form-checkbox rounded text-[#0E2804] mr-2" />
        <label for="notifications" class="text-gray-700 dark:text-gray-200">Enable push notifications for news & results</label>
      </div>
      <button type="submit" class="w-full py-2 rounded-lg bg-[#0E2804] text-white font-semibold hover:bg-[#145c0a] transition">Continue</button>
    </form>
    <div class="mt-6 text-xs text-gray-500 dark:text-gray-400 text-center">
      Your preferences are saved securely and can be updated anytime.
    </div>
    <!-- Offline/Sync banner example -->
    <div class="hidden mt-4 bg-yellow-100 dark:bg-yellow-900 text-yellow-700 dark:text-yellow-200 px-4 py-2 rounded-lg text-sm" id="offline-banner">
      You are offline. Changes will sync when connection is restored.
    </div>
  </div>
</body>
</html>
