[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msc_project"
version = "0.1.0"
dependencies = []

# Use setuptools package discovery to locate local packages automatically.
[tool.setuptools.packages.find]
where = ["."]
include = ["Global_Client_Layer*", "States*", "Single-Agent*", "three_amigos*"]